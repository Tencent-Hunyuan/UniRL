# Single-stage Qwen-Image deployment for full-parameter native IPC RL.
pipeline: unirl_rl_image_diffusion
async_chunk: false
distributed_executor_backend: mp
weight_transfer_config:
  backend: ipc

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    vae_use_slicing: false
    vae_use_tiling: false
    cache_backend: null
    cache_config: null
    enable_cache_dit_summary: false
    # Keep the stage-local value explicit.  The current Omni projection
    # preserves an engine-level null override, so a stage field is required
    # for diffusion workers to expose native IPC topology to UniRL.
    weight_transfer_config:
      backend: ipc
    weight_transfer_apply_strategy: direct-load
    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 1
      enable_expert_parallel: false
      sequence_parallel_size: 1
      ulysses_degree: 1
      ring_degree: 1
      cfg_parallel_size: 1
      vae_patch_parallel_size: 1
      use_hsdp: false
      hsdp_shard_size: -1
      hsdp_replicate_size: 1
    custom_pipeline_args:
      pipeline_class: unirl.rollout.engine.vllm_omni.pipelines.qwen_image.pipeline.RLQwenImagePipeline
    worker_extension_cls: unirl.rollout.engine.vllm_omni.worker.dit_extension.DiTWeightSyncExtension
