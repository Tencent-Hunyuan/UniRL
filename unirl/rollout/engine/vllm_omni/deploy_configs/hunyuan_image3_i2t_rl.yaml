# HunyuanImage-3 multimodal AR deployment for the i2t adapter.
pipeline: unirl_hi3_ar_multimodal_text
async_chunk: false
distributed_executor_backend: mp

stages:
  - stage_id: 0
    devices: "0,1,2,3"
    max_num_seqs: 1
    worker_extension_cls: unirl.rollout.engine.vllm_omni.worker.ar_extension.HI3ARWeightSyncExtension
    enable_lora: true
    gpu_memory_utilization: 0.95
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    max_num_batched_tokens: 32768
    tensor_parallel_size: 4
    pipeline_parallel_size: 1
    hf_overrides:
      rope_parameters:
        mrope_section: [0, 32, 32]
        rope_type: default
    default_sampling_params:
      temperature: 0.0
      top_p: 0.95
      top_k: 1024
      max_tokens: 2048
      stop_token_ids: [127957, 128024, 128026]
      detokenize: true
