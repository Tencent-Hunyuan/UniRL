# HunyuanImage-3 text-to-image deployment with UniRL worker extensions.
pipeline: hunyuan_image_3_moe
async_chunk: false

stages:
  - stage_id: 0
    devices: "0,1,2,3"
    max_num_seqs: 1
    worker_extension_cls: unirl.rollout.engine.vllm_omni.worker.ar_extension.HI3ARWeightSyncExtension
    enable_lora: true
    gpu_memory_utilization: 0.9
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    max_num_batched_tokens: 32768
    tensor_parallel_size: 4
    pipeline_parallel_size: 1
    distributed_executor_backend: mp
    hf_overrides:
      rope_parameters:
        mrope_section: [0, 32, 32]
        rope_type: default
    omni_kv_config:
      need_send_cache: true
      kv_transfer_criteria:
        type: prefill_finished
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      repetition_penalty: 1.1

  - stage_id: 1
    devices: "4,5,6,7"
    max_num_seqs: 1
    enforce_eager: true
    distributed_executor_backend: mp
    vae_use_slicing: false
    vae_use_tiling: false
    cache_backend: null
    cache_config: null
    enable_cache_dit_summary: false
    omni_kv_config:
      need_recv_cache: true
    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 4
      enable_expert_parallel: false
      sequence_parallel_size: 1
      ulysses_degree: 1
      ring_degree: 1
      cfg_parallel_size: 1
      vae_patch_parallel_size: 1
      use_hsdp: false
      hsdp_shard_size: -1
      hsdp_replicate_size: 1
    custom_pipeline_args:
      pipeline_class: unirl.rollout.engine.vllm_omni.pipelines.hi3.pipeline.RLHunyuanImage3Pipeline
    worker_extension_cls: unirl.rollout.engine.vllm_omni.worker.dit_extension.DiTWeightSyncExtension

edges:
  - from: 0
    to: 1
    window_size: -1
    max_inflight: 1
