# HunyuanImage-3 image-to-image deployment with UniRL worker extensions.
pipeline: hunyuan_image_3_moe
async_chunk: false

stages:
  - stage_id: 0
    devices: "0,1,2,3"
    max_num_seqs: 1
    worker_extension_cls: unirl.rollout.engine.vllm_omni.worker.ar_extension.HI3ARWeightSyncExtension
    enable_lora: true
    gpu_memory_utilization: 0.95
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    max_num_batched_tokens: 32768
    tensor_parallel_size: 4
    pipeline_parallel_size: 1
    distributed_executor_backend: mp
    hf_overrides:
      rope_parameters:
        mrope_section: [0, 32, 32]
        rope_type: default
    default_sampling_params:
      temperature: 0.6
      top_p: 0.95
      top_k: 1024
      max_tokens: 4096
      stop_token_ids: [127957]
      detokenize: true

  - stage_id: 1
    devices: "4,5,6,7"
    max_num_seqs: 1
    enforce_eager: true
    trust_remote_code: true
    distributed_executor_backend: mp
    parallel_config:
      tensor_parallel_size: 4
      enable_expert_parallel: true
    custom_pipeline_args:
      pipeline_class: unirl.rollout.engine.vllm_omni.pipelines.hi3.pipeline.RLHunyuanImage3Pipeline
    worker_extension_cls: unirl.rollout.engine.vllm_omni.worker.dit_extension.DiTWeightSyncExtension
    default_sampling_params:
      num_inference_steps: 50
      guidance_scale: 2.5

edges:
  - from: 0
    to: 1
