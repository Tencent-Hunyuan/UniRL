# HunyuanImage-3 standalone DiT deployment for the two-engine trainer.
pipeline: hunyuan_image3_dit
async_chunk: false
distributed_executor_backend: mp

stages:
  - stage_id: 0
    devices: "4,5,6,7"
    max_num_seqs: 1
    gpu_memory_utilization: 0.7
    enforce_eager: true
    trust_remote_code: true
    vae_use_slicing: false
    vae_use_tiling: false
    cache_backend: null
    cache_config: null
    enable_cache_dit_summary: false
    omni_kv_config:
      need_recv_cache: true
    parallel_config:
      tensor_parallel_size: 4
      enable_expert_parallel: true
    custom_pipeline_args:
      pipeline_class: unirl.rollout.engine.vllm_omni.pipelines.hi3.pipeline.RLHunyuanImage3Pipeline
    worker_extension_cls: unirl.rollout.engine.vllm_omni.worker.dit_extension.DiTWeightSyncExtension
