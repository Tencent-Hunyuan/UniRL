# MiniMax-H3 single-stage text-to-video+audio deployment for RL rollout.
# One engine owns a four-GPU replica; recipes override the parallel layout
# through `rollout.config.omni_extra`, which takes precedence over this file.
pipeline: unirl_rl_video_diffusion
async_chunk: false
distributed_executor_backend: mp

stages:
  - stage_id: 0
    devices: "0,1,2,3"
    model_class_name: MiniMaxH3Pipeline
    task_type: t2va
    max_num_seqs: 1
    enforce_eager: true
    vae_use_slicing: false
    vae_use_tiling: true
    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 1
      cfg_parallel_size: 1
      allgather_degree: 1
      sequence_parallel_size: 4
      ulysses_degree: 4
      ring_degree: 1
      text_encoder_tp_size: 4
      vae_patch_parallel_size: 4
      vae_parallel_mode: tile
      use_hsdp: true
      hsdp_shard_size: 4
      hsdp_replicate_size: 1
    custom_pipeline_args:
      pipeline_class: unirl.rollout.engine.vllm_omni.pipelines.minimax_h3.MiniMaxH3RLPipeline
    worker_extension_cls: unirl.rollout.engine.vllm_omni.worker.dit_extension.DiTWeightSyncExtension
