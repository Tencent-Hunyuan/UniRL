stage_args:
  - stage_id: 0
    stage_type: diffusion
    runtime:
      process: true
      devices: "0,1,2,3"
      max_batch_size: 1
    engine_args:
      model_stage: diffusion
      task_type: t2va
      enforce_eager: true
      distributed_executor_backend: "mp"
      enable_sleep_mode: true
      vae_use_slicing: false
      vae_use_tiling: true
      vae_parallel_mode: tile
      cache_backend: null
      cache_config: null
      enable_cache_dit_summary: false
      # Required for online rank-32 adapter updates from the FSDP trainer.
      enable_lora: true
      max_lora_rank: 32
      parallel_config:
        pipeline_parallel_size: 1
        data_parallel_size: 1
        tensor_parallel_size: 1
        enable_expert_parallel: false
        sequence_parallel_size: 4
        ulysses_degree: 4
        ring_degree: 1
        cfg_parallel_size: 1
        vae_patch_parallel_size: 4
        text_encoder_tp_size: 4
        use_hsdp: true
        hsdp_shard_size: 4
        hsdp_replicate_size: 1
      custom_pipeline_args:
        pipeline_class: unirl.rollout.engine.vllm_omni.pipelines.minimax_h3.MiniMaxH3RLPipeline
      # Adds the byte-copy LoRA receive RPC used by the four-way grouped
      # rollout engine while preserving the custom RL pipeline worker.
      worker_extension_cls: unirl.rollout.engine.vllm_omni.worker.dit_extension.DiTWeightSyncExtension
    final_output: true
    final_output_type: video

runtime:
  enabled: true
  defaults:
    window_size: -1
    max_inflight: 1
