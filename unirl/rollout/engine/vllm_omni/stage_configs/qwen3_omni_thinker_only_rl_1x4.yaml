# Qwen3-Omni Thinker-only stage, TP=4.
stage_args:
  - stage_id: 0
    runtime:
      devices: "0,1,2,3"
    engine_args:
      model_stage: thinker
      model_arch: Qwen3OmniMoeThinkerForConditionalGeneration
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      engine_output_type: text
      hf_config_name: thinker_config

      tensor_parallel_size: 4
      distributed_executor_backend: "mp"

      gpu_memory_utilization: 0.4
      max_num_seqs: 64
      max_num_batched_tokens: 32768
      enable_chunked_prefill: true

      dtype: bfloat16
      load_format: safetensors
      trust_remote_code: true
      enable_prefix_caching: false
      enforce_eager: true

      enable_lora: true
      max_lora_rank: 64
      max_loras: 1

      # Add the weight-sync receivers to the AR worker.
      worker_extension_cls: unirl.rollout.engine.vllm_omni.worker.qwen3_omni_ar_extension.Qwen3OmniARWeightSyncExtension

      enable_sleep_mode: true
      logprobs_mode: processed_logprobs
      disable_log_stats: true
    final_output: true
    final_output_type: text
    is_comprehension: true
