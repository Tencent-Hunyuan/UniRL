# Single-stage SenseNova-U1.5 text-to-image config for RL rollout.
#
# vLLM-Omni owns the TP-aware NEO-Unify implementation. UniRL replaces only
# the outer pipeline loop so the rollout uses driver-authored x_T, stochastic
# FlowGRPO transitions, and replay-ready prefix-cache capture.

stage_args:
  - stage_id: 0
    stage_type: diffusion
    runtime:
      process: true
      devices: "0"
      max_batch_size: 4
    engine_args:
      model_stage: diffusion
      enforce_eager: true
      distributed_executor_backend: "mp"
      cache_backend: null
      cache_config: null
      enable_cache_dit_summary: false
      enable_lora: false
      parallel_config:
        pipeline_parallel_size: 1
        data_parallel_size: 1
        tensor_parallel_size: 1
        enable_expert_parallel: false
        sequence_parallel_size: 1
        ulysses_degree: 1
        ring_degree: 1
        cfg_parallel_size: 1
        vae_patch_parallel_size: 1
        use_hsdp: false
        hsdp_shard_size: -1
        hsdp_replicate_size: 1
      custom_pipeline_args:
        pipeline_class: unirl.rollout.engine.vllm_omni.pipelines.sensenova_u1.pipeline.RLSenseNovaU1Pipeline
      worker_extension_cls: unirl.rollout.engine.vllm_omni.worker.dit_extension.DiTWeightSyncExtension
    final_output: true
    final_output_type: image

runtime:
  enabled: true
  defaults:
    window_size: -1
    max_inflight: 1
