# ─────────────────────────────────────────────────────────────────────────────
# drpo — annotated config EXTRACT (for reading, not launching).
#
# Lifted from the full runnable recipe:
#     examples/ar/qwen3_drpo_4b_base_dapo_sglang.yaml
# Build the data once (datasets/dapo_math/prepare_dapo_math.py), then launch (see README.md):
#     DATA_PATH=data/dapo_math/train.jsonl EVAL_DATA_PATH=data/dapo_math/aime_eval.jsonl \
#     python -m unirl.train_ar --config-name=ar/qwen3_drpo_4b_base_dapo_sglang num_devices=32
#
# Shown here: the algorithm + sampling blocks (what the loss does), the advantage
# flag, and the SGLang rollout + full-weight sync wiring. Omitted: bundle / pipeline /
# backend (FSDP full fine-tuning) / reward / stack / data_source — model & infra, not algorithm.
# ─────────────────────────────────────────────────────────────────────────────

# Advantage normalization (top-level _global_ keys):
adv_normalization_scope: group   # per-prompt-group mean/std (critic-free GRPO)
normalize_adv_by_std: false      # mean-center only (reward − group_mean), NO std
                                 #   division — drops GRPO's difficulty bias
                                 #   (reference norm_adv_by_std_in_grpo=False).

# ── The algorithm. DRPO implements the paper's DRPO loss (§3): the smooth,
# advantage-weighted, token-adaptive SPO quadratic — NOT a hard tv/kl mask. ──
algorithm:
  _target_: unirl.algorithms.drpo.DRPO
  stage_attr: ar                 # resolve the AR stage from the trainer-injected pipeline (.ar)
  drpo_epsilon: 12.5             # ε: regularization threshold (paper §4). Loss is
                                 #   L_t = −A_t*r_t + |A_t|*µ*(r_t − 1)² / (2*ε), the
                                 #   token-adaptive SPO quadratic (per-token trust
                                 #   region ε_t = ε/µ); larger ε ⇒ weaker regularization.
  loss_agg_mode: seq-mean-token-sum-norm  # per-seq Σ(token loss) / horizon, mean over seqs
  horizon: ${sampling.max_new_tokens}  # fixed length normalizer for seq-mean-token-sum-norm
  # 1.0 — MUST equal sampling.temperature below. Replay tempers logits
  #   (log_softmax(logits / T)) so new_logp (π) and rollout logp (µ) live on the
  #   same distribution ⇒ ratio_mean ≈ 1 on update 1.
  sampling_temperature: ${sampling.temperature}
  old_logp_source: rollout       # anchor on the rollout logp µ for every update;
                                 #   replay = frozen train-side π_old (see README).
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.qwen3.conditions.Qwen3ARConditions

# AR sampling — no SDE scheduler (token-level, not diffusion). Group size drives
# the critic-free GRPO advantage; temperature must match sampling_temperature above.
sampling:
  _target_: unirl.types.sampling.ARSamplingParams
  samples_per_prompt: 8          # group size G for the per-prompt advantage (n=8 × batch=64 = 512/rollout)
  temperature: 1.0
  top_p: 1.0                     # no truncation: SGLang's returned logp (log_softmax(logits/T))
  top_k: 0                       #   is then the exact sampling distribution µ. top_k=20 (Qwen3
                                 #   default) also collapses group diversity and stalls training.
  max_new_tokens: 8192

# ── SGLang rollout engine (colocate): time-shares each GPU with the FSDP train
# shard via sleep()/wake_up(). tp_size=1 ⇒ one single-GPU engine per rank,
# data-parallel across the ranks (mirrors the trainside engine). ──
rollout:
  _target_: unirl.rollout.engine.sglang.engine.SGLangRolloutEngine
  config:
    _target_: unirl.rollout.engine.sglang.config.SGLangEngineConfig
    backend: native
    pretrained_model_ckpt_path: ${oc.env:QWEN3_PATH,Qwen/Qwen3-4B-Base}
    tp_size: 1
    concurrency: 16              # = per-engine sequences at 32 GPUs (64 × 8 / 32)
    samples_pre_expanded: true   # trainer pre-expands req by samples_per_prompt; engine emits n=1
    chat_template_kwargs:
      enable_thinking: true      # paper setup (long CoT); MUST match pipeline.enable_thinking
    engine_kwargs:
      rl_on_policy_target: fsdp  # deterministic sampling + log_softmax and FSDP-matching
                                 #   kernels, so rollout logp µ tracks the trainer's replay
      mem_fraction_static: 0.3   # leave FSDP headroom for the per-rollout full-weight all-gather
      skip_server_warmup: true
      attention_backend: triton
      disable_cuda_graph: false
      cuda_graph_max_bs_decode: 16  # cap captured buffers so they don't compete with the weight push
      enable_lora: false         # full fine-tuning: no LoRA pool

# ── Weight sync: push the full dense FSDP weights into the SGLang server every
# rollout (update_weights_from_tensor). Qwen3's HF param names match SGLang's
# weight map, so no name_remap is needed. ──
sync:
  _target_: unirl.distributed.weight_sync.full.tensor.TensorWeightSync
  lora_merged: false
  bucket_size_mb: 64
  flush_cache: true

# Multi-update is supported: the old_logp anchor is frozen per rollout batch, so
# the full recipe sets stack.num_updates_per_batch: 4.
