name: PR Review Status Labels

# workflow_run restores write access after the unprivileged fork-safe collector.
# This workflow must never check out or execute pull-request-controlled content.
on:
  workflow_run:
    workflows: [PR Review Event]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  # Labeling a PR goes through the issues API endpoint, but GitHub scopes the
  # token check to the target resource: PRs require pull-requests write.
  pull-requests: write
  issues: write

# Per-PR concurrency: a single shared group silently drops the earlier PR's sync
# when reviews land on two PRs within seconds (GitHub keeps one pending run per
# group), while no group at all lets same-PR runs race each other's label writes.
# Same-repo PRs serialize by PR number. Fork PRs (workflow_run.pull_requests is
# empty for them) serialize by head repo+branch — equivalent per PR in practice
# (two open PRs off one head branch would share a group). Manual dispatch sweeps
# share their own literal fallback group.
concurrency:
  group: pr-review-status-labels-${{ github.event.workflow_run.pull_requests[0].number || format('{0}-{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) }}
  cancel-in-progress: false

jobs:
  sync-labels:
    name: Sync PR review status labels
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request_review' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download review event
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: pr-review-event
          path: ${{ runner.temp }}/pr-review-event
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconcile status labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_EVENT_PATH: ${{ runner.temp }}/pr-review-event/pr-number
        run: |
          set -euo pipefail

          sync_pr() {
            local number="$1"
            local pr state draft decision target label encoded

            if ! [[ "$number" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Invalid PR number: $number"
              return 1
            fi

            pr=$(gh pr view "$number" \
              --repo "$GITHUB_REPOSITORY" \
              --json state,isDraft,reviewDecision,labels)
            state=$(jq -r '.state' <<<"$pr")
            [ "$state" = "OPEN" ] || return 0

            draft=$(jq -r '.isDraft' <<<"$pr")
            decision=$(jq -r '.reviewDecision // ""' <<<"$pr")
            if [ "$draft" = "true" ]; then
              target="wip"
            else
              case "$decision" in
                APPROVED) target="approved" ;;
                CHANGES_REQUESTED) target="changes requested" ;;
                *) target="need review" ;;
              esac
            fi

            for label in "wip" "need review" "changes requested" "approved"; do
              [ "$label" = "$target" ] && continue
              if jq -e --arg name "$label" '.labels | any(.name == $name)' <<<"$pr" >/dev/null; then
                encoded=$(jq -rn --arg label "$label" '$label | @uri')
                # A racing run may have removed the label already, so a 404 is benign —
                # but ONLY a 404. Swallowing 403/5xx would turn permission regressions
                # into green runs with wrong labels (the one failure ever observed in
                # production was exactly a 403).
                if ! out=$(gh api --method DELETE \
                      "repos/$GITHUB_REPOSITORY/issues/$number/labels/$encoded" 2>&1 >/dev/null); then
                  grep -q "HTTP 404" <<<"$out" || { echo "$out" >&2; return 1; }
                fi
              fi
            done

            if ! jq -e --arg name "$target" '.labels | any(.name == $name)' <<<"$pr" >/dev/null; then
              gh api "repos/$GITHUB_REPOSITORY/issues/$number/labels" \
                -f "labels[]=$target" \
                >/dev/null
            fi

            echo "PR #$number: $target"
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            if [ ! -f "$REVIEW_EVENT_PATH" ]; then
              echo "::error::Review event artifact is missing its PR number"
              exit 1
            fi
            number=$(tr -d '[:space:]' < "$REVIEW_EVENT_PATH")
            sync_pr "$number"
          else
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq '.[].number' |
              while IFS= read -r number; do
                sync_pr "$number"
              done
          fi
