name: vLLM-Omni Contracts

on:
  pull_request:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: |
          python -m pip install torch==2.13.0 torchvision==0.28.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            pytest pyyaml pillow psutil hydra-core omegaconf numpy ray \
            diffusers==0.40.0 transformers==5.12.1 kernels==0.14.1 \
            aenum==3.1.16 pydantic cbor2 pyzmq janus aiohttp \
            openai-harmony openai msgspec pybase64 blake3 setproctitle \
            prometheus-client cloudpickle py-cpuinfo cachetools uvloop \
            llguidance tiktoken xgrammar loguru fastapi prettytable \
            accelerate==1.12.0 soundfile torchsde "imageio[ffmpeg]" \
            x-transformers einops gguf pydantic-settings cache-dit==1.5.0
          python -m pip install --no-deps vllm==0.28.0 vllm-omni==0.28.0

      - name: Run vLLM-Omni contracts
        env:
          VLLM_OMNI_REQUIRE_INSTALLED: "1"
        run: python -m pytest -q tests/rollout/vllm_omni
