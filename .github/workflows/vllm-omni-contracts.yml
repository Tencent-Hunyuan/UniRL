name: vLLM-Omni Contracts

on:
  pull_request:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: |
          python -m pip install pytest pyyaml pillow psutil hydra-core omegaconf numpy ray
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run vLLM-Omni contracts
        run: python -m pytest -q tests/rollout/vllm_omni
