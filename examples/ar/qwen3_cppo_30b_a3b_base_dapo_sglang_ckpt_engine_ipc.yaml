# @package _global_
#
# Checkpoint-engine IPC variant of
# qwen3_cppo_30b_a3b_base_dapo_sglang_full_weight_sync.yaml.
#
# Same 8xH20 colocate layout (HTTP SGLang, TP8/EP8). The only functional
# change is the sync transport: per-GPU checkpoint-engine IPC instead of
# serialized tensor buckets. Native backend is not used here — UniRL still
# rejects native tp_size>1.
#
# Qwen3-30B's bf16 token embedding is ~594 MiB and checkpoint-engine cannot
# split one logical tensor across buckets, so bucket_size_mb is 640.
#
# Run:
#   VENV_DIR=/path/to/venv \
#   QWEN3_PATH=/path/to/Qwen3-30B-A3B-Base \
#   DATA_PATH=/path/to/dapo_math/train.jsonl \
#   EVAL_DATA_PATH=/path/to/dapo_math/aime_eval.jsonl \
#   ENTRY=train_ar bash examples/run_experiment_single_node.sh \
#     ar/qwen3_cppo_30b_a3b_base_dapo_sglang_ckpt_engine_ipc

num_devices: 8
batch_size: 16
num_rollouts: 800
weight_sync_interval: 1
eval_interval: 10
eval_num_prompts: 16
eval_batch_size: 8
eval_samples_per_prompt: 8

enable_fsdp_offload: true

adv_normalization_scope: group
normalize_adv_by_std: false

logging:
  report_to_wandb: false
  project_name: unirl-cppo
  run_name: cppo_qwen3-30b-a3b-base_dapo_sglang_ckpt_engine_ipc
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [cppo, qwen3, 30b-a3b-base, dapo, sglang, ckpt-engine-ipc, single-node]

bundle:
  _target_: unirl.models.qwen3.bundle.Qwen3Bundle.from_config
  config:
    _target_: unirl.models.qwen3.config.Qwen3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN3_PATH,Qwen/Qwen3-30B-A3B-Base}
    model_precision: fp32
    meta_init_transformer: true
    use_gradient_checkpointing: true

pipeline:
  _target_: unirl.models.qwen3.pipeline.Qwen3Pipeline.from_bundle
  enable_thinking: true
  autocast_precision: bf16
  logprob_precision: fp32

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["Qwen3MoeDecoderLayer"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
    forward_prefetch: false
    defer_grad_sync: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 3200

rollout:
  _target_: unirl.rollout.engine.sglang.engine.SGLangRolloutEngine
  config:
    _target_: unirl.rollout.engine.sglang.config.SGLangEngineConfig
    backend: http
    pretrained_model_ckpt_path: ${oc.env:QWEN3_PATH,Qwen/Qwen3-30B-A3B-Base}
    tp_size: 8
    ep_size: 8
    max_new_tokens: 4096
    temperature: 1.0
    top_p: 1.0
    concurrency: 64
    samples_pre_expanded: true
    enable_memory_saver: true
    enable_weights_cpu_backup: true
    skip_server_warmup: false
    chat_template_kwargs:
      enable_thinking: true
    engine_kwargs:
      mem_fraction_static: 0.15
      attention_backend: triton
      disable_cuda_graph: false
      cuda_graph_max_bs: 64
      enable_lora: false

reward:
  _target_: unirl.reward.service.RewardService
  truncated_reward: keep
  backend:
    _target_: unirl.reward.local.mathverify.MathVerifyRewardScorer
    base_device: cpu
    config:
      _target_: unirl.reward.local.mathverify.MathVerifySpec

algorithm:
  _target_: unirl.algorithms.cppo.CPPO
  stage_attr: ar
  cppo_delta: 0.20
  cppo_w_min: 0.8
  cppo_delta_b: 0.02
  loss_agg_mode: seq-mean-token-sum-norm
  horizon: 4096
  sampling_temperature: 1.0
  old_logp_source: rollout
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.qwen3.conditions.Qwen3ARConditions

# Per-GPU checkpoint-engine IPC. Unlike the serialized tensor path this does
# not concentrate flatten/deserialization copies on the TP-zero GPU.
sync:
  _target_: unirl.distributed.weight_sync.full.ckpt_engine_ipc.CkptEngineIPCWeightSync
  lora_merged: false
  bucket_size_mb: 640
  wire_dtype: bf16
  flush_cache: true

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  num_updates_per_batch: 4

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: ${oc.env:DATA_PATH}
      eval_data_path: ${oc.env:EVAL_DATA_PATH,${oc.env:DATA_PATH}}
      seed: 42
    algorithm:
      prompts_per_rollout: 16

sampling:
  _target_: unirl.types.sampling.ARSamplingParams
  samples_per_prompt: 16
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  max_new_tokens: 4096
