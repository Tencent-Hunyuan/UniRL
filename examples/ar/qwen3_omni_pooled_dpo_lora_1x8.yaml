# @package _global_
# Qwen3-Omni Thinker · Omni-Preference pooled audio+image · offline DPO + LoRA · 8 GPU.
#
# Offline direct preference optimization: no rollout, no reward, no weight sync.
# One manifest row is one preference pair; ARPreferenceTrackBuilder expands it
# into adjacent [chosen, rejected] rows and unirl.algorithms.dpo.DPO differences
# them against the LoRA-disabled base model as the reference policy.
#
# batch_size counts PAIRS. Keep it divisible by the DP size and keep
# stack.micro_batch_size even, or a pair is split and the loss cannot form.
#
# Prepare:
#   python datasets/omni_preference/convert_omni_preference_to_unirl.py \
#     --snapshot /path/to/Omni-Preference --modality image   # then concatenate with the audio manifest \
#     --out-dir datasets/omni_preference_pooled_dpo
#
# Launch:
#   QWEN3_OMNI_PATH=/path/to/Qwen3-Omni-30B-A3B-Instruct \
#   DPO_DATA=datasets/omni_preference_pooled_dpo/train.jsonl \
#   DPO_EVAL_DATA=datasets/omni_preference_pooled_dpo/val.jsonl \
#   ENTRY=train_sft bash examples/run_experiment_single_node.sh \
#     ar/qwen3_omni_pooled_dpo_lora_1x8

num_devices: 8
devices_per_node: 8
batch_size: 32          # preference pairs; DP=8 -> 4 pairs/rank -> 8 rows/rank
num_steps: 200
eval_interval: 25
eval_batch_size: 8
eval_num_samples: 64
save_interval: 50
save_dir: ${oc.env:DPO_SAVE_DIR,checkpoints/dpo_qwen3_omni_pooled}
save_mode: auto

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,false}}
  project_name: ${oc.env:WANDB_PROJECT,unirl-qwen3-omni-dpo}
  run_name: ${oc.env:WANDB_RUN_NAME,qwen3-omni-omni-preference-pooled-dpo-lora}
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [dpo, qwen3-omni, thinker, pooled, audio, image, omni-preference, lora, moe-lora, 1x8]

bundle:
  _target_: unirl.models.qwen3_omni.bundle.Qwen3OmniBundle.from_config
  config:
    _target_: unirl.models.qwen3_omni.config.Qwen3OmniPipelineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN3_OMNI_PATH,/path/to/Qwen3-Omni-30B-A3B-Instruct}
    model_precision: bf16
    # Pooled batches carry audio rows, and audio cu_seqlens are only honored by the
    # FA2 varlen path; SDPA silently widens the audio tower's windowed attention.
    attn_implementation: flash_attention_2
    freeze_vision_tower: true
    freeze_audio_tower: true
    use_lora: true
    lora_target_modules: [q_proj, k_proj, v_proj, o_proj]
    use_gradient_checkpointing: true
    max_prompt_length: 16384
    image_max_pixels: 262144
    use_audio_in_video: false

pipeline:
  _target_: unirl.models.qwen3_omni.pipeline.Qwen3OmniPipeline.from_bundle
  max_prompt_length: 16384
  image_max_pixels: ${bundle.config.image_max_pixels}
  use_audio_in_video: false
  autocast_precision: bf16
  logprob_precision: fp32

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["Qwen3OmniMoeThinkerTextDecoderLayer"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    forward_prefetch: true
    activation_checkpointing: false
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: cosine
    warmup_steps: 24
    # The schedule counts optimizer steps: num_steps x stack.num_updates_per_batch.
    total_steps: 800
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 32
    alpha: 64
    # PEFT's ParamWrapper (target_parameters) rejects lora_dropout != 0.
    dropout: 0.0
    bias: none
    task_type: CAUSAL_LM
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
    # Packed MoE experts are nn.Parameter, so they need naming here rather than in
    # target_modules; training-only (see unirl/train/readme.md Gotchas).
    target_parameters:
      - gate_up_proj
      - down_proj
    # PEFT injects adapters by name even under frozen encoder modules, and an
    # adapter inside a tower would also change what the reference policy is.
    exclude_modules: ".*visual.*|.*audio_tower.*"

algorithm:
  _target_: unirl.algorithms.dpo.DPO
  stage_attr: ar
  beta: 0.1
  label_smoothing: 0.1
  loss_type: sigmoid
  average_log_prob: false
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.qwen3_omni.conditions.Qwen3OmniARConditions

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 2   # one whole preference pair per forward
  max_grad_norm: 1.0
  # 4 optimizer steps per data batch, matching verl's train_batch=32 / ppo_mini=8.
  # 8 rows/rank / 4 = 2 rows = 1 whole pair per update.
  num_updates_per_batch: 4

track_builder:
  _target_: unirl.train.sft.track_builder.ARPreferenceTrackBuilder
  max_response_length: 1024

data_source:
  _target_: unirl.data.sft.SupervisedDataSource
  manifest_path: ${oc.env:DPO_DATA,datasets/omni_preference_pooled_dpo/train.jsonl}
  eval_manifest_path: ${oc.env:DPO_EVAL_DATA,datasets/omni_preference_pooled_dpo/val.jsonl}
  seed: 42
  # Mixed-modality batches break Batch.slice, so keep each batch to one modality.
  group_by_modality: ${batch_size}
