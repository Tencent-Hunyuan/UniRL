# @package _global_
# Qwen3-Omni Thinker · GSPO + LoRA · Daily-Omni audio/video MCQA · vLLM-Omni · 4 GPU.
#
# 4-GPU single-replica Daily-Omni audio-in-video recipe.
# TP=4 (required — TP must divide the audio tower's 20 attention heads) uses all
# 4 GPUs for the rollout engine; training FSDP DP=4 time-shares the same cards via
# sleep/wake (enable_fsdp_offload).
#
# Launch:
#   CUDA_VISIBLE_DEVICES=0,1,2,3 \
#   QWEN3_OMNI_PATH=/path/to/Qwen3-Omni-30B-A3B-Instruct \
#   DATA_PATH=/path/to/daily_omni_av/train.jsonl \
#   EVAL_DATA_PATH=/path/to/daily_omni_av/val.jsonl \
#   PYTHONPATH=$(pwd) \
#   python -m unirl.train_ar --config-name=ar/qwen3_omni_audio_video_gspo_lora_vllm_omni_1x4

num_devices: 4
devices_per_node: 4
batch_size: 4

num_rollouts: 500
weight_sync_interval: 1

adv_normalization_scope: group

eval_interval: 5
eval_num_prompts: -1
eval_samples_per_prompt: 1
eval_temperature: 1.0

# The anchor must differ from rank 0 to avoid a synchronous self-call.
rollout_anchor_device: 1
# Manual colocate dance: FSDP2 owns sharding only; ARTrainer explicitly moves
# the whole training model (including the frozen vision/audio encoders) between
# CPU and GPU around rollout. This is intentionally separate from
# fsdp_cfg.cpu_offload=false below, which disables FSDP CPUOffloadPolicy so the
# two placement mechanisms cannot fight over the frozen encoder weights.
enable_fsdp_offload: true

logging:
  report_to_wandb: true
  project_name: unirl-qwen3-omni
  run_name: qwen3_omni_daily_omni_av_gspo_lora_vllm_omni_1x4
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [gspo, qwen3-omni, thinker, video, audio, audio-in-video, vllm-omni, lora, daily-omni, 1x4]

bundle:
  _target_: unirl.models.qwen3_omni.bundle.Qwen3OmniBundle.from_config
  config:
    _target_: unirl.models.qwen3_omni.config.Qwen3OmniPipelineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN3_OMNI_PATH,/path/to/Qwen3-Omni-30B-A3B-Instruct}
    model_precision: bf16
    # Qwen3-Omni audio cu_seqlens are only honored by the FA2 varlen path;
    # SDPA silently turns the intended windowed attention into full attention.
    attn_implementation: flash_attention_2
    freeze_vision_tower: true
    freeze_audio_tower: true
    use_lora: true
    lora_target_modules: [q_proj, k_proj, v_proj, o_proj]
    use_gradient_checkpointing: true
    max_prompt_length: 16384
    video_fps: 2.0
    video_max_frames: 64
    video_max_pixels: 262144
    use_audio_in_video: true

pipeline:
  _target_: unirl.models.qwen3_omni.pipeline.Qwen3OmniPipeline.from_bundle
  max_prompt_length: 16384
  video_fps: 2.0
  video_max_frames: 64
  video_max_pixels: 262144
  use_audio_in_video: true

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["Qwen3OmniMoeThinkerTextDecoderLayer"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    # Manual offload (enable_fsdp_offload) owns CPU<->GPU. FSDP CPUOffloadPolicy
    # must not be enabled together, or two placement owners compete.
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    forward_prefetch: true
    activation_checkpointing: false
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 500
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 32
    alpha: 64
    dropout: 0.0
    bias: none
    task_type: CAUSAL_LM
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
    # PEFT injects adapters by name even under frozen encoder modules.
    exclude_modules: ".*visual.*|.*audio_tower.*"

# vLLM-Omni thinker rollout, TP=4 (all 4 cards).
rollout:
  _target_: unirl.rollout.engine.vllm_omni.engine.VLLMOmniRolloutEngine
  model_config: ${bundle.config}
  config:
    _target_: unirl.rollout.engine.vllm_omni.config.VLLMOmniEngineConfig
    model_path: ${oc.env:QWEN3_OMNI_PATH,/path/to/Qwen3-Omni-30B-A3B-Instruct}
    modality: qwen3_omni_thinker
    # Audio-in-video must serialize packed forwards to avoid elevated rollout/replay K3.
    stage_yaml_override: qwen3_omni_thinker_only_rl_audio_video_1x4.yaml
    enable_sleep_mode: true
    max_prompt_length: 16384
    video_fps: 2.0
    video_max_pixels: 262144
    use_audio_in_video: true
    omni_extra:
      stage_init_timeout: 1200
      init_timeout: 1800

sync:
  _target_: unirl.distributed.weight_sync.lora.RemoteLoraWeightSync
  # vLLM-Omni's thinker mapper requires this prefix.
  param_prefix: "thinker."
  adapter_name: default
  verify: true
  copy: true

reward:
  _target_: unirl.reward.service.RewardService
  truncated_reward: keep
  overlong_buffer_len: 4096
  overlong_penalty_factor: 1.0
  backend:
    # Daily-Omni requires an explicit "The answer is [X]" final phrase.
    _target_: unirl.reward.local.mc_exact_match.MCExactMatchRewardScorer
    base_device: cpu
    config:
      _target_: unirl.reward.local.mc_exact_match.MCExactMatchSpec
      graded_format_reward: false
      require_answer_phrase: true

algorithm:
  _target_: unirl.algorithms.gspo.GSPO
  stage_attr: ar
  # Widened from the GSPO paper defaults (3e-4/4e-4): under vLLM-Omni rollout the
  # rollout<->replay per-seq ratio sits ~0.86-0.98 (|1-ratio| ~2-14%), so the paper
  # clip pins clip_fraction at 1.0 (fully clipped). 1e-3/2e-3 admits gradient.
  clip_range: 1.0e-3
  clip_range_high: 1.33e-3
  clip_schedule: constant
  sampling_temperature: 1.0
  # π_old anchor from a pre-update train-side replay (ratio starts ≈1 and the
  # tiny GSPO clip only bites on optimizer drift). Under this mode the true
  # training↔rollout drift remains visible in the rollout_replay/k3 metrics,
  # computed against the preserved ``segment.rollout_log_probs``.
  old_logp_source: replay
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.qwen3_omni.conditions.Qwen3OmniARConditions

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  num_updates_per_batch: 1

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: ${oc.env:DATA_PATH,datasets/daily_omni_av/train.jsonl}
      eval_data_path: ${oc.env:EVAL_DATA_PATH,datasets/daily_omni_av/val.jsonl}
      seed: 42
    algorithm:
      prompts_per_rollout: 4

sampling:
  _target_: unirl.types.sampling.ARSamplingParams
  samples_per_prompt: 8
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  max_new_tokens: 2048
