# @package _global_
# LIN-531 — Colocate PARTIAL-ROLLOUT deep-research: AgenticPartialTrainer over the
# AgenticRolloutEngine, COLOCATE (train + rollout time-share each GPU, TensorWeightSync). The
# synchronous partial-rollout sibling of deep_research_calc_mathverify.yaml (barrier AgenticTrainer):
# over-samples `oversample_batch_size` prompt-groups, commits the freshest `batch_size` complete GRPO
# groups, and `abort`s the in-flight tail at a turn boundary — `tail_policy: carry` re-submits it next
# round because this recipe's CalculatorTool is stateless and its Sample preserves the conversation.
# Cuts the straggler while keeping all GPUs for generation; the per-token rollout-anchored ratio
# corrects a carried trajectory even when its turns span multiple weight versions.
#
# Run (single node):
#   QWEN3_INSTRUCT_PATH=/path/to/Qwen3 DATA_PATH=data/calc_math/train.jsonl \
#   python -m unirl.train_partial_deep_research \
#     --config-name=deep_research/deep_research_calc_mathverify_partial num_devices=8

num_devices: 2
batch_size: 4 # P complete GRPO groups committed per rollout step; P*n divisible by num_devices
num_rollouts: 40
weight_sync_interval: 1
eval_interval: 0 # agentic eval not implemented (AgenticTrainer.evaluate raises); keep 0

# ---- partial-rollout knobs (LIN-531) ----
oversample_batch_size: 6 # generate 6 prompt-groups/drive; commit the freshest 4 → 2 slow groups carried
buffer_max_staleness: 1 # a completed buffered group may cross up to 1 weight sync before eviction
tail_policy: carry # CalculatorTool is stateless; the Sample contains all state needed to resume

# Colocate partial oversubscribes rank 0: its own run_drain + every worker's next_task pull +
# the poll→drain_completed fan + submit/abort/sync all ride these threaded-actor slots. Give it
# generous headroom (barrier only needs 8 because it never poll-fans).
worker_max_concurrency: 24

stop: ["</tool_call>"]
adv_normalization_scope: group
normalize_adv_by_std: true

logging:
  report_to_wandb: false
  project_name: unirl-deep-research
  run_name: deepresearch_calc_mathverify_qwen3_partial
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [deep-research, agentic, calculator, mathverify, qwen3, partial-rollout, colocate, carry, lin-531]

bundle:
  _target_: unirl.models.qwen3.bundle.Qwen3Bundle.from_config
  config:
    _target_: unirl.models.qwen3.config.Qwen3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN3_INSTRUCT_PATH,Qwen/Qwen3-4B-Instruct}
    model_precision: fp32
    use_gradient_checkpointing: true
    attn_implementation: flex_attention

pipeline:
  _target_: unirl.models.qwen3.pipeline.Qwen3Pipeline.from_bundle
  enable_thinking: false
  autocast_precision: bf16
  logprob_precision: fp32

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["Qwen3DecoderLayer"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
    forward_prefetch: false
    defer_grad_sync: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.01
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 1000

rollout:
  _target_: unirl.rollout.engine.agentic.engine.AgenticRolloutEngine
  config:
    _target_: unirl.rollout.engine.agentic.config.AgenticRolloutEngineConfig
    max_turns: 4
    per_worker_concurrency: 8
    partial_rollout: true # LIN-531: abort→checkpoint→resume at turn boundaries
    inner:
      _target_: unirl.rollout.engine.sglang.config.SGLangEngineConfig
      backend: native
      pretrained_model_ckpt_path: ${oc.env:QWEN3_INSTRUCT_PATH,Qwen/Qwen3-4B-Instruct}
      tp_size: 1
      max_new_tokens: 1024
      temperature: 1.0
      top_p: 1.0
      concurrency: 8
      chat_template_kwargs:
        enable_thinking: false
      engine_kwargs:
        mem_fraction_static: 0.3 # colocate: shares the GPU with the FSDP train shard (sleep/wake)
        skip_server_warmup: true
        attention_backend: triton
        disable_cuda_graph: false
        cuda_graph_max_bs: 16
        enable_lora: false
    env:
      _target_: unirl.rollout.loop.tool_environment.ToolEnvironment
      max_turns: 4
      tools:
        - _target_: unirl.rollout.loop.tools.calculator.CalculatorTool
    episode_sampling:
      _target_: unirl.types.sampling.ARSamplingParams
      samples_per_prompt: 2 # n — GRPO group; keep == sampling.samples_per_prompt
      temperature: 1.0
      top_p: 1.0
      top_k: 0
      max_new_tokens: 1024

reward:
  _target_: unirl.reward.service.RewardService
  truncated_reward: keep
  backend:
    _target_: unirl.reward.local.mathverify.MathVerifyRewardScorer
    base_device: cpu
    config:
      _target_: unirl.reward.local.mathverify.MathVerifySpec

algorithm:
  _target_: unirl.algorithms.grpo.GRPO
  stage_attr: ar
  clip_range: 0.2
  clip_range_high: null
  clip_schedule: constant
  loss_agg_mode: seq-mean-token-mean
  horizon: 1024
  sampling_temperature: 1.0
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.qwen3.conditions.Qwen3ARConditions

sync:
  # Colocate full-weight push into the inner SGLang (delegated through the agentic engine). Runs in
  # the awake+decode-idle window abort() leaves.
  _target_: unirl.distributed.weight_sync.full.tensor.TensorWeightSync
  lora_merged: false
  bucket_size_mb: 64
  flush_cache: true

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  num_updates_per_batch: 1

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: ${oc.env:DATA_PATH}
      eval_data_path: ${oc.env:EVAL_DATA_PATH,${oc.env:DATA_PATH}}
      seed: 42
    algorithm:
      prompts_per_rollout: 6 # == oversample_batch_size (the per-drive prompt pool)

sampling:
  _target_: unirl.types.sampling.ARSamplingParams
  samples_per_prompt: 2 # MUST match episode_sampling
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  max_new_tokens: 1024
