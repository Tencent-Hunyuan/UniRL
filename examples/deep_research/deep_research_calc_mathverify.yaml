# @package _global_
# M1 — Deep-research agentic RL: AgenticTrainer over the AgenticRolloutEngine,
# validated WITHOUT external services (the existing CalculatorTool + a rule-based
# MathVerify reward). This proves the whole agentic train loop end-to-end —
# multi-turn rollout (List[Sample]) -> judge -> group GRPO advantage -> one
# optimizer step -> on-policy ratio≈1 — so M2 only swaps in the search/visit tools
# and the LLM-judge reward (config-only). See docs/tongyi-deepresearch-port-estimate.md.
#
# Data: a small jsonl of arithmetic word-problems with a numeric answer, e.g.
#   {"prompt": "What is 1234 * 5678? Use the calculator tool, then put the final
#               answer in <answer>...</answer>.", "metadata": {"answer": "7006652"}}
# The gold answer MUST be nested under "metadata" — MultimodalRLDataSource reads the
# per-row "metadata" dict verbatim (a top-level "answer" is NOT lifted); the trainer
# reads metadata["answer"] for the verifier.
#
# Run (single node, >=2 GPUs; rank 0 owns the driver + the agentic coordinator):
#   QWEN3_INSTRUCT_PATH=/path/to/Qwen3-4B-Instruct DATA_PATH=data/calc_math/train.jsonl \
#   python -m unirl.train_agentic --config-name=deep_research/deep_research_calc_mathverify num_devices=2

num_devices: 2
batch_size: 4 # P prompts_per_rollout; P*n = 8 must be divisible by num_devices
num_rollouts: 20
weight_sync_interval: 1 # push full dense weights into the inner SGLang every rollout
eval_interval: 0 # agentic eval not implemented yet (AgenticTrainer.evaluate raises)

# rank-0 coordinator runs generate + its own drain + serves next_task pulls
# concurrently on a threaded Worker — needs >=3 (smoke uses 8).
worker_max_concurrency: 8

# Per-turn stop: a tool-call turn ends at </tool_call> and yields to the tool; a
# final-answer turn runs to EOS. Rides the request root's control["ar"].
stop: ["</tool_call>"]

# Group-relative GRPO (per-prompt mean/std over the n siblings).
adv_normalization_scope: group
normalize_adv_by_std: true

logging:
  report_to_wandb: false # M1 validation runs without wandb; flip on for real runs
  project_name: unirl-deep-research
  run_name: deepresearch_calc_mathverify_qwen3
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [deep-research, agentic, calculator, mathverify, qwen3, m1]

bundle:
  _target_: unirl.models.qwen3.bundle.Qwen3Bundle.from_config
  config:
    _target_: unirl.models.qwen3.config.Qwen3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN3_INSTRUCT_PATH,Qwen/Qwen3-4B-Instruct}
    model_precision: fp32
    use_gradient_checkpointing: true
    attn_implementation: flex_attention

pipeline:
  # enable_thinking OFF for the calculator smoke (shorter turns). Replay uses each
  # turn's captured conditions, so this need only stay consistent with the rollout.
  _target_: unirl.models.qwen3.pipeline.Qwen3Pipeline.from_bundle
  enable_thinking: false
  autocast_precision: bf16
  logprob_precision: fp32

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["Qwen3DecoderLayer"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
    forward_prefetch: false
    defer_grad_sync: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.01
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 1000

rollout:
  # Multi-turn agentic engine: a rank-0 coordinator over a DP slab of per-worker
  # pull-drain loops, each running one inner single-turn SGLang engine + one
  # ToolEnvironment. generate(batch) returns a flat List[Sample] of variable-depth
  # trajectories. The engine auto-injects env.tool_schemas() into the inner chat
  # template (single source of truth), so the tools are advertised to the model.
  _target_: unirl.rollout.engine.agentic.engine.AgenticRolloutEngine
  config:
    _target_: unirl.rollout.engine.agentic.config.AgenticRolloutEngineConfig
    max_turns: 4
    # max concurrent trajectories per worker — a small multiple of the inner
    # backend concurrency so tool-waiting trajectories don't starve the GPU.
    per_worker_concurrency: 8
    inner:
      _target_: unirl.rollout.engine.sglang.config.SGLangEngineConfig
      backend: native
      pretrained_model_ckpt_path: ${oc.env:QWEN3_INSTRUCT_PATH,Qwen/Qwen3-4B-Instruct}
      tp_size: 1
      max_new_tokens: 1024 # per TURN (fallback; episode_sampling below overrides per request)
      temperature: 1.0
      top_p: 1.0
      concurrency: 8
      chat_template_kwargs:
        enable_thinking: false
        # `tools` is auto-injected from the env's tool_schemas() at engine build.
      engine_kwargs:
        mem_fraction_static: 0.3
        skip_server_warmup: true
        attention_backend: triton
        disable_cuda_graph: false
        cuda_graph_max_bs: 16
        enable_lora: false
    env:
      _target_: unirl.rollout.loop.tool_environment.ToolEnvironment
      max_turns: 4 # keep == config.max_turns
      tools:
        - _target_: unirl.rollout.loop.tools.calculator.CalculatorTool
    # Per-turn sampling; samples_per_prompt = n (the GRPO group size the
    # coordinator fans out). top_k 0 = off (diversity for GRPO groups).
    episode_sampling:
      _target_: unirl.types.sampling.ARSamplingParams
      samples_per_prompt: 2
      temperature: 1.0
      top_p: 1.0
      top_k: 0
      max_new_tokens: 1024

reward:
  # Rule-based MathVerify (no external service): 1.0 if the parsed <answer> matches
  # the ground truth else 0.0. The trainer extracts each trajectory's <answer> span
  # and scores it once over a flat scoring Sample.
  _target_: unirl.reward.service.RewardService
  truncated_reward: keep
  backend:
    _target_: unirl.reward.local.mathverify.MathVerifyRewardScorer
    base_device: cpu
    config:
      _target_: unirl.reward.local.mathverify.MathVerifySpec

algorithm:
  _target_: unirl.algorithms.grpo.GRPO
  stage_attr: ar
  clip_range: 0.2
  clip_range_high: null
  clip_schedule: constant
  loss_agg_mode: seq-mean-token-mean
  horizon: 1024
  # MUST equal episode_sampling.temperature so replay's tempered log-softmax matches
  # the rollout sampler (ratio_mean ≈ 1 on an on-policy step).
  sampling_temperature: 1.0
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.qwen3.conditions.Qwen3ARConditions

sync:
  # Colocate full-weight push into the inner SGLang each rollout (delegated through
  # the agentic engine to its inner engine).
  _target_: unirl.distributed.weight_sync.full.tensor.TensorWeightSync
  lora_merged: false
  bucket_size_mb: 64
  flush_cache: true

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  # Strict on-policy MVP: one optimizer update per rollout (ratio == 1 exactly on
  # every trained turn). Raise later for rollout-anchored multi-update.
  num_updates_per_batch: 1

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: ${oc.env:DATA_PATH} # jsonl: {"prompt": ..., "metadata": {"answer": ...}}
      eval_data_path: ${oc.env:EVAL_DATA_PATH,${oc.env:DATA_PATH}} # unused (eval_interval=0); defaults to train
      seed: 42
    algorithm:
      prompts_per_rollout: 4 # == batch_size (P); P*n = 8 trajectories / rollout

sampling:
  # Trainer-side params: samples_per_prompt MUST match episode_sampling (wandb
  # samples_per_prompt logging + the scoring-Sample fork). The engine's
  # episode_sampling is what actually drives per-turn generation.
  _target_: unirl.types.sampling.ARSamplingParams
  samples_per_prompt: 2
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  max_new_tokens: 1024
