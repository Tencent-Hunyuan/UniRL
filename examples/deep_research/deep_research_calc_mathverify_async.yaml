# @package _global_
# LIN-531 — Fully-async agentic RL: AsyncAgenticTrainer over the AgenticRolloutEngine,
# DISAGGREGATED. The async sibling of deep_research_calc_mathverify.yaml (colocate
# AgenticTrainer): training (FSDP) and the agentic rollout engine run on DISJOINT GPU
# slabs (train_fraction), the engine stays RESIDENT, and weights cross the slab
# boundary via NCCLWeightSync (not the colocate TensorWeightSync).
#
# Partial rollout: on each weight sync the trainer abort()s the in-flight tail at a
# TURN boundary (single-version Parts), syncs, and resumes the carried partials under
# the new weights. This is safe here because CalculatorTool is stateless and the Sample
# contains the whole conversation. StatefulTool sessions must use tail_policy=drop until
# cross-worker stateful resume is implemented. buffer_max_staleness bounds staleness.
#
# Data: same arithmetic-word-problem jsonl as the colocate recipe
#   {"prompt": "... put the final answer in <answer>...</answer>.", "metadata": {"answer": "7006652"}}
#
# Run (single node, >=2 GPUs; train_fraction=0.5 → 1 train GPU + 1 rollout GPU; rank 0
# owns the driver + the agentic coordinator on the rollout slab):
#   QWEN3_INSTRUCT_PATH=/path/to/Qwen3-4B-Instruct DATA_PATH=data/calc_math/train.jsonl \
#   python -m unirl.train_async_deep_research \
#     --config-name=deep_research/deep_research_calc_mathverify_async num_devices=2

num_devices: 2
batch_size: 4 # P complete GRPO groups trained per rollout step
num_rollouts: 20
weight_sync_interval: 1 # abort→NCCL-sync→resume every rollout
eval_interval: 0 # agentic eval not implemented yet (AgenticTrainer.evaluate raises)

# ---- async / disaggregation knobs (LIN-531) ----
train_fraction: 0.5 # 0.5 * num_devices GPUs train (FSDP); the rest run the resident engine
# Over-sample the rollout slab: submit oversample_batch_size prompt-groups per drive so
# the slab stays busy across the sync-cycle (>= batch_size).
oversample_batch_size: 8
# Off-policy staleness budget: a buffered complete group may be up to this many weight
# syncs old before it is evicted. 0 = on-policy (ratio≈1); >0 = bounded off-policy.
buffer_max_staleness: 1
tail_policy: carry # CalculatorTool is stateless; the carried Sample is sufficient to resume exactly

# rank-0 coordinator runs the background drain + serves next_task pulls + the
# poll/abort/drained control RPCs concurrently on a threaded Worker — needs >=3.
worker_max_concurrency: 8

# Per-turn stop: a tool-call turn ends at </tool_call> and yields to the tool.
stop: ["</tool_call>"]

# Group-relative GRPO (per-prompt mean/std over the n siblings).
adv_normalization_scope: group
normalize_adv_by_std: true

logging:
  report_to_wandb: false # flip on for real runs; async metrics: async/version_span, async/buffer_groups
  project_name: unirl-deep-research
  run_name: deepresearch_calc_mathverify_qwen3_async
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [deep-research, agentic, calculator, mathverify, qwen3, async, partial-rollout, carry, lin-531]

bundle:
  _target_: unirl.models.qwen3.bundle.Qwen3Bundle.from_config
  config:
    _target_: unirl.models.qwen3.config.Qwen3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN3_INSTRUCT_PATH,Qwen/Qwen3-4B-Instruct}
    model_precision: fp32
    use_gradient_checkpointing: true
    attn_implementation: flex_attention

pipeline:
  _target_: unirl.models.qwen3.pipeline.Qwen3Pipeline.from_bundle
  enable_thinking: false
  autocast_precision: bf16
  logprob_precision: fp32

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["Qwen3DecoderLayer"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
    forward_prefetch: false
    defer_grad_sync: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.01
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 1000

rollout:
  # Multi-turn agentic engine, DISAGGREGATED: owns its own GPU slab and stays RESIDENT
  # (no sleep()/wake_up()). The rank-0 coordinator drives a background drain the trainer
  # reaps (poll) and interrupts (abort). partial_rollout=true enables the turn-boundary
  # checkpoint/resume on each weight sync for this stateless CalculatorTool recipe.
  _target_: unirl.rollout.engine.agentic.engine.AgenticRolloutEngine
  config:
    _target_: unirl.rollout.engine.agentic.config.AgenticRolloutEngineConfig
    max_turns: 4
    per_worker_concurrency: 8
    partial_rollout: true # LIN-531: abort→checkpoint→resume at turn boundaries
    inner:
      _target_: unirl.rollout.engine.sglang.config.SGLangEngineConfig
      backend: native
      pretrained_model_ckpt_path: ${oc.env:QWEN3_INSTRUCT_PATH,Qwen/Qwen3-4B-Instruct}
      tp_size: 1
      max_new_tokens: 1024 # per TURN (episode_sampling below overrides per request)
      temperature: 1.0
      top_p: 1.0
      concurrency: 8
      chat_template_kwargs:
        enable_thinking: false
        # `tools` is auto-injected from the env's tool_schemas() at engine build.
      engine_kwargs:
        # Disaggregated: the engine owns the rollout GPU (no colocated FSDP shard), so
        # it can reserve more KV than the colocate recipe's 0.3. Leave headroom for the
        # NCCL weight-receive buffers during the cross-slab broadcast.
        mem_fraction_static: 0.8
        skip_server_warmup: true
        attention_backend: triton
        disable_cuda_graph: false
        cuda_graph_max_bs: 16
        enable_lora: false
    env:
      _target_: unirl.rollout.loop.tool_environment.ToolEnvironment
      max_turns: 4 # keep == config.max_turns
      tools:
        - _target_: unirl.rollout.loop.tools.calculator.CalculatorTool
    # Per-turn sampling; samples_per_prompt = n (the GRPO group size the coordinator
    # fans out AND the async assembler groups by). Keep == sampling.samples_per_prompt.
    episode_sampling:
      _target_: unirl.types.sampling.ARSamplingParams
      samples_per_prompt: 2
      temperature: 1.0
      top_p: 1.0
      top_k: 0
      max_new_tokens: 1024

reward:
  _target_: unirl.reward.service.RewardService
  truncated_reward: keep
  backend:
    _target_: unirl.reward.local.mathverify.MathVerifyRewardScorer
    base_device: cpu
    config:
      _target_: unirl.reward.local.mathverify.MathVerifySpec

algorithm:
  _target_: unirl.algorithms.grpo.GRPO
  stage_attr: ar
  clip_range: 0.2
  clip_range_high: null
  clip_schedule: constant
  loss_agg_mode: seq-mean-token-mean
  horizon: 1024
  # MUST equal episode_sampling.temperature so replay's tempered log-softmax matches the
  # rollout sampler; with staleness>0 the rollout-anchored ratio absorbs the version gap.
  sampling_temperature: 1.0
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.qwen3.conditions.Qwen3ARConditions

sync:
  # Cross-slab full-weight sync (disaggregated): train rank 0 NCCL-broadcasts the full
  # dense FSDP weights into the resident agentic engine's inner SGLang
  # (init_weights_update_group + update_weights_from_distributed). flush_cache resets
  # SRT KV/prefix on the last bucket. Wired one-time by AsyncAgenticTrainer._connect_separate.
  _target_: unirl.distributed.weight_sync.full.nccl.NCCLWeightSync
  group_name: weight_sync
  lora_merged: false
  bucket_size_mb: 512
  flush_cache: true

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  # With buffer_max_staleness>0 a batch may be off-policy; the rollout-anchored ratio
  # makes multi-update safe. Kept at 1 here for a clean async smoke.
  num_updates_per_batch: 1

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: ${oc.env:DATA_PATH} # jsonl: {"prompt": ..., "metadata": {"answer": ...}}
      eval_data_path: ${oc.env:EVAL_DATA_PATH,${oc.env:DATA_PATH}} # unused (eval_interval=0)
      seed: 42
    algorithm:
      prompts_per_rollout: 8 # == oversample_batch_size (the producer's per-drive pool)

sampling:
  # Trainer-side params: samples_per_prompt MUST match episode_sampling (the async
  # assembler's group size n + the scoring-Sample fork).
  _target_: unirl.types.sampling.ARSamplingParams
  samples_per_prompt: 2
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  max_new_tokens: 1024
