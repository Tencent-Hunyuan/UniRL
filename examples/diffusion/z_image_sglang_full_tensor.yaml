# @package _global_
# Z-Image (base) + SGLang dedicated rollout, colocate, LoRA training + MERGED
# full-weight sync (tensor-payload), v2 trainer, FlowGRPO, REPLAY logprob.
#
# Why full-weight sync (not LoRA-adapter sync): SGLang's Z-Image attention uses a
# FUSED qkv projection (one MergedColumnParallelLinear `attention.to_qkv`), while
# the trainer-side diffusers ZImageTransformer2DModel uses SEPARATE to_q/to_k/to_v.
# A bare LoRA-adapter push (separate q/k/v keys) does not line up with the fused
# to_qkv LoRA layer. So we still TRAIN LoRA (backend.lora_cfg), but each sync folds
# the LoRA delta into the base weights (sync.lora_merged: true) and pushes the
# MERGED full model — SGLang's weight loader maps the separate q/k/v base weights
# into its fused to_qkv exactly as it does at checkpoint load, sidestepping the
# fused-qkv LoRA mapping entirely. (A future LoRA-adapter-sync recipe would need a
# separate->fused qkv LoRA fusion in adapt_lora_for_sglang.)
#
# Dedicated rollout (contrast with z_image_trainside.yaml): the SGLang
# DiffGenerator runs the FULL diffusion pipeline (Qwen3 text-encode + S3-DiT
# denoise + VAE decode) in its own worker subprocess. REPLAY mode: the trainer
# recomputes the pi_old anchor via ZImageDiffusionStage.replay; the GRPO ratio is
# 1.0 at iter-0 (rollout/replay use identical sigma schedule + conditions).
#
# CFG OFF (guidance_scale=0): SGLang gates CFG on guidance_scale>1, so 0 keeps it
# off; trainer-side replay also runs CFG-free (no negative_text emitted).
#
# Scale via launcher (num_devices = cluster GPU count); runs on 2 (H20 smoke),
# 8 (1-node) and 32 (4x8) GPUs. batch_size=64 divides 2/8/32. Quick smoke:
#   batch_size=2 sampling.samples_per_prompt=4 num_rollouts=2

num_devices: 8
batch_size: 64                # prompts_per_rollout (divisible by 2/8/32)
adv_use_global_std: true     # advantage: divide by ONE batch-wide std (v1 parity), not per-group
num_rollouts: 10000

logging:
  # Env-driven so multi-node runs enable W&B with REPORT_TO_WANDB=true (the
  # launcher exports it). rank-0/driver only; no-op when false.
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,false}}
  project_name: ${oc.env:WANDB_PROJECT,unirl-zimage}
  run_name: ${oc.env:WANDB_RUN_NAME,z_image_base_sglang}
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: null

# Shared nodes: model_config + strategy defined once, referenced by
# bundle / pipeline / rollout. SGLang needs both at init in its subprocess
# (it loads its own copy of the weights off model_config.pretrained_*).
# NOTE: use_lora is intentionally NOT set here — SGLang loads a plain (no-adapter)
# model and receives MERGED full weights via the sync block below.
model_config:
  _target_: unirl.models.z_image.config.ZImagePipelineConfig
  pretrained_model_ckpt_path: ${oc.env:Z_IMAGE_PATH,Tongyi-MAI/Z-Image}
  model_precision: bf16
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  max_sequence_length: 512
  # Static FlowMatch shift; base Z-Image's scheduler_config.json declares
  # use_dynamic_shifting=false + shift=6.0. The SGLang engine reads this to build
  # its sigma schedule via FlowMatchSchedulePolicy.from_pretrained (Z-Image has no
  # build_schedule_policy() hook → generic static-shift branch, same as SD3).
  shift: 6.0

# Shared SDE strategy; SGLang resolves its sde_label (flow -> "sde") from it.
strategy:
  _target_: unirl.sde.kernels.FlowSDEStrategy

bundle:
  _target_: unirl.models.z_image.bundle.ZImageBundle.from_config
  config: ${model_config}

# Trainer-side pipeline: used by REPLAY to recompute pi_old (and by eval). The
# rollout itself runs in SGLang, not here.
pipeline:
  _target_: unirl.models.z_image.pipeline.ZImagePipeline
  shift: 6.0
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  max_sequence_length: 512
  strategy: ${strategy}

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["ZImageTransformerBlock"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    # 6B S3-DiT + Qwen3 text encoder under full-graph replay: keep AC on.
    activation_checkpointing: true
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 10000
  # LoRA training — synced as a MERGED full model (sync.lora_merged: true), so the
  # rollout engine runs the merged weights without a separate adapter.
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 64
    alpha: 128
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    # Z-Image single-stream attention (diffusers Attention inside
    # ZImageTransformerBlock): q/k/v projections + output proj.
    target_modules:
      - to_k
      - to_out.0
      - to_q
      - to_v

rollout:
  _target_: unirl.rollout.engine.sglang.engine.SGLangRolloutEngine
  config:
    _target_: unirl.rollout.engine.sglang.config.SGLangEngineConfig
    model_family: z_image
    populate_conditions: true   # pack SGLang prompt_embeds into resp.conditions['text'] for replay
    init_same_noise: ${sampling.init_same_noise}
    # Chunk generate into sub-batches so SGLang bounds its DiT-forward / VAE-decode
    # peak memory (6B DiT + Qwen3 encoder are heavy); mirrors z_image_trainside.
    forward_batch_size: 8
    num_gpus: 1
    tp_size: 1
    local_mode: true
    engine_kwargs:
      model_type: z_image
  # SGLang reads ckpt off model_config and sde_label off strategy.
  model_config: ${model_config}
  strategy: ${strategy}

reward:
  _target_: unirl.reward.service.RewardService
  backend:
    _target_: unirl.reward.local.pickscore.PickScoreRewardScorer
    base_device: cuda
    config:
      _target_: unirl.reward.local.pickscore.PickScoreSpec
      batch_size: 8
      device: auto
      processor_id: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
      model_id: yuvalkirstain/PickScore_v1

algorithm:
  _target_: unirl.algorithms.flowgrpo.FlowGRPO
  stage_attr: diffusion
  clip_range: 1.0e-4
  clip_schedule: constant
  # REPLAY mode: trainer recomputes the pi_old anchor via stage.replay at update
  # time (engine emits trajectories; its native log-probs, if any, are ignored).
  old_logp_source: replay
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.z_image.conditions.ZImageConditions
  params: ${sampling}

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 8
  max_grad_norm: 1.0
  num_updates_per_batch: 2      # PPO mini-batches per rollout (π_old frozen once); v1 parity

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: datasets/pickscore/train.txt
      eval_data_path: datasets/pickscore/test.txt
      seed: 42
    algorithm:
      prompts_per_rollout: ${batch_size}

sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 12       # base Z-Image multi-step (matches trainside)
  guidance_scale: 0.0           # CFG OFF (SGLang gates CFG on >1; 0 disables it)
  height: 512
  width: 512
  eta: 0.7
  samples_per_prompt: 16
  seed: 42
  init_same_noise: false
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  scheduler:
    _target_: unirl.utils.scheduler_utils.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    num_sde_steps: 3
    # SDE-step window: confine SDE noise to the early high-σ steps.
    timestep_fraction: [0, 0.5]

# Every N rollouts the loop pushes the freshly-trained full weights into the
# engine just before that rollout's generate. 1 = on-policy.
weight_sync_interval: 1

# LoRA -> MERGED full-weight sync -> SGLang rollout (colocate tensor-payload).
sync:
  _target_: unirl.distributed.weight_sync.full.tensor.TensorWeightSync
  # Fold the trained LoRA delta into the base weights and push the merged full
  # model (we LoRA-train but serve a merged model — no separate adapter), so the
  # fused-qkv mapping is handled by SGLang's base-weight loader.
  lora_merged: true
  bucket_size_mb: 512
  flush_cache: true
  # Ordered first-match-wins name rewrite (see FullWeightSync._apply_name_remap):
  # backend.model is the bare ZImageTransformer2DModel (merged_state_dict yields
  # layers.* / noise_refiner.* / all_x_embedder.* etc.), so the "*" catch-all
  # nests every key under the receiver's transformer.* namespace.
  name_remap: {"*": "transformer.*"}
