# @package _global_
# Does vLLM-Omni sample the same policy the trainer differentiates?
#
# Flow-GRPO anchored on the engine's own log-probs, so ratio and |Δlogp| measure
# engine-vs-trainer agreement rather than the inner update loop. Everything else
# matches the NFT recipe's shape: colocate 1x8, 288x384, LoRA synced each rollout.
#
# Launch (1 node x 8 GPUs):
#   bash examples/run_experiment_single_node.sh diffusion/minimax_h3/minimax_h3_t2va_vllmomni_ratio_check

defaults:
  - minimax_h3_t2va_base
  - _self_

num_devices: 8
devices_per_node: 8
batch_size: 8
num_rollouts: 3
transport: colocate_store
layout: colocate
reward_fraction: 0.0
enable_fsdp_offload: true
offload_train_during_reward: true
eval_interval: 0

bundle:
  config:
    use_lora: true

algorithm:
  # The base anchors both sides on stage.replay, which cancels the rollout-vs-replay
  # asymmetry this run exists to measure.
  old_logp_source: rollout
  # Report the divergence instead of aborting on it — the number is the result.
  max_rollout_replay_logp_absdiff: null
  rollout_replay_parity_action: warn

rollout:
  _target_: unirl.rollout.engine.vllm_omni.engine.VLLMOmniRolloutEngine
  model_config: ${bundle.config}
  config:
    _target_: unirl.rollout.engine.vllm_omni.config.VLLMOmniEngineConfig
    model_path: ${bundle.config.pretrained_model_ckpt_path}
    modality: minimax_h3_t2va
    enable_sleep_mode: true
    replica_size: 4
    tp_size: 4

sync:
  _target_: unirl.distributed.weight_sync.lora.LocalLoraWeightSync
  param_prefix: "transformer."
  transport: file
  verify: false

reward:
  backend:
    config:
      batch_size: 8
      frame_selection: middle
      weights:
        videopickscore: 1.0
        clap: 0.0

data_source:
  args:
    run:
      data_path: ${oc.env:H3_PROMPT_FILE,examples/diffusion/minimax_h3/smoke_prompts.txt}
      eval_data_path: ${oc.env:H3_PROMPT_FILE,examples/diffusion/minimax_h3/smoke_prompts.txt}

sampling:
  height: 288
  width: 384
  # One transition: replay retains every selected step in a single graph, and the
  # measured peak at one is already 92,188 MiB of a 97,871-MiB H20.
  sde_indices: [6]

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,false}}
  run_name: ${oc.env:WANDB_RUN_NAME,minimax_h3_t2va_vllmomni_ratio_check}
  tags: [minimax-h3, t2va, flowgrpo, vllm-omni, colocate, ratio-parity]
