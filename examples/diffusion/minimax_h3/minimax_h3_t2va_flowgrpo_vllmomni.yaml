# @package _global_
# The retuned H3 Flow-GRPO recipe (celve/unirl#13) with vLLM-Omni generating.
#
# #13 established a rising reward on the trainside engine — pooled +0.00234/step
# over two seeds, t=+6.67 — by moving off 768x768 so every SDE step is replayable
# and by scoring with imagebind instead of a first-frame-only videopickscore. This
# carries those settings across and changes only what the engine swap forces.
#
# It also answers whether the swap is sound at all: #13 notes its own ratio is
# inert, since old_logp_source=replay computes both sides at the same weights.
# Anchoring on the engine's log-probs instead makes ratio and |Delta logp| a direct
# engine-vs-trainer comparison, and with one update per batch nothing else moves.
#
# Launch (1 node x 8 GPUs):
#   bash examples/run_experiment_single_node.sh diffusion/minimax_h3/minimax_h3_t2va_flowgrpo_vllmomni

defaults:
  - minimax_h3_t2va_base
  - _self_

num_devices: 8
devices_per_node: 8
batch_size: 8
num_rollouts: 1000
transport: colocate_store
layout: colocate
reward_fraction: 0.0
enable_fsdp_offload: true
offload_train_during_reward: true
eval_interval: 0

bundle:
  config:
    use_lora: true

backend:
  optimizer_cfg:
    learning_rate: 1.0e-4

algorithm:
  # The base anchors both sides on stage.replay, which cancels the rollout-vs-replay
  # asymmetry this run exists to measure.
  old_logp_source: rollout
  # Report the divergence rather than aborting on it — the number is the result.
  max_rollout_replay_logp_absdiff: null
  rollout_replay_parity_action: warn

stack:
  num_updates_per_batch: 1

rollout:
  _target_: unirl.rollout.engine.vllm_omni.engine.VLLMOmniRolloutEngine
  model_config: ${bundle.config}
  config:
    _target_: unirl.rollout.engine.vllm_omni.config.VLLMOmniEngineConfig
    model_path: ${bundle.config.pretrained_model_ckpt_path}
    modality: minimax_h3_t2va
    enable_sleep_mode: true
    replica_size: 4
    tp_size: 4

# adapter_name is deliberately absent: it falls back to backend.rollout_adapter_name,
# which is the adapter the trainer is actually updating.
sync:
  _target_: unirl.distributed.weight_sync.lora.LocalLoraWeightSync
  param_prefix: "transformer."
  transport: file
  verify: false

reward:
  backend:
    config:
      weights:
        # Zeroed rather than dropped: this block merges onto the base's weights, so
        # omitting the key leaves its 0.5 standing. #13 replaced it because it scores
        # the first frame only and is near-constant in what this optimises.
        videopickscore: 0.0
        imagebind: 1.0
        clap: 1.0

data_source:
  args:
    run:
      data_path: ${oc.env:H3_PROMPT_FILE,datasets/pickscore/train.txt}
      eval_data_path: ${oc.env:H3_PROMPT_FILE,datasets/pickscore/test.txt}

sampling:
  # #13 trains at 256x384, a 3:2 canvas H3 does not list; the engine's adapter only
  # resolves 21:9, 16:9, 4:3, 1:1, 3:4 and 9:16. This is the nearest official
  # landscape ratio, 12.5% more packed rows than #13 measured.
  height: 288
  width: 384
  # null, not a subset: resolve_sde_indices then falls back to every step, so all
  # ten record log-probs and all ten are replayed and trained.
  sde_indices: null
  samples_per_prompt: 16
  init_same_noise: false

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,true}}
  run_name: ${oc.env:WANDB_RUN_NAME,minimax_h3_t2va_flowgrpo_vllmomni}
  tags: [minimax-h3, t2va, flowgrpo, vllm-omni, colocate, ratio-parity]
