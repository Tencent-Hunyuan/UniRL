# @package _global_
# Four-GPU rollout replica: DiT TP2 x Ulysses2, text encoder TP4. The fastest
# verified rollout topology in examples/diffusion/minimax_h3/README.md.

defaults:
  - minimax_h3_t2va_vllmomni_32c_quality100
  - _self_

rollout:
  config:
    omni_extra:
      tensor_parallel_size: 2
      sequence_parallel_size: 2
      ulysses_degree: 2
      use_hsdp: false
      hsdp_shard_size: -1

logging:
  run_name: h3-quality100-tp2-up2
  tags: [minimax-h3, quality, flowgrpo, tp2, up2, text-tp4]
