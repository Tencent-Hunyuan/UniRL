# @package _global_
# DiffusionART counterpart of hunyuan_video10_t2v_trainside.yaml.
# ODE rollout retains every state; anchors are recomputed before two disjoint updates.
num_devices: 8
batch_size: 8
adv_use_global_std: true
logging:
  report_to_wandb: true
  project_name: ${oc.env:WANDB_PROJECT,unirl-diffusionart}
  run_name: ${oc.env:WANDB_RUN_NAME,hunyuan_video10_t2v_art_trainside}
  entity: ${oc.env:WANDB_ENTITY,null}
  tags:
  - hunyuan_video10
  - t2v
  - diffusionart
  - trainside
  - lora-r64
  - v2
bundle:
  _target_: unirl.models.hunyuan_video10.bundle.HunyuanVideo10Bundle.from_config
  config:
    _target_: unirl.models.hunyuan_video10.config.HunyuanVideo10PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,hunyuanvideo-community/HunyuanVideo}
    model_precision: bf16
    vae_use_tiling: true
    shift: 5.0
    hidden_state_skip_layer: 2
pipeline:
  _target_: unirl.models.hunyuan_video10.pipeline.HunyuanVideo10Pipeline
  shift: 5.0
  hidden_state_skip_layer: ${bundle.config.hidden_state_skip_layer}
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy
backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names:
  - HunyuanVideoTransformerBlock
  - HunyuanVideoSingleTransformerBlock
  - HunyuanVideoTokenReplaceTransformerBlock
  - HunyuanVideoTokenReplaceSingleTransformerBlock
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    master_dtype: fp32
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 0.0003
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-08
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 10000
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 64
    alpha: 256
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
    - attn.to_q
    - attn.to_k
    - attn.to_v
    - attn.to_out.0
    - attn.add_q_proj
    - attn.add_k_proj
    - attn.add_v_proj
    - attn.to_add_out
    - ff.net.0.proj
    - ff.net.2
    - ff_context.net.0.proj
    - ff_context.net.2
rollout:
  _target_: unirl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs:
  - diffusion
  forward_batch_size: 1
reward:
  _target_: unirl.reward.service.RewardService
  backend:
    _target_: unirl.reward.local.video_pickscore.VideoPickScoreScorer
    base_device: cuda
    config:
      _target_: unirl.reward.local.video_pickscore.VideoPickScoreSpec
      batch_size: 8
      device: auto
      processor_id: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
      model_id: yuvalkirstain/PickScore_v1
algorithm:
  _target_: unirl.algorithms.diffusionart.DiffusionART
  restore_zero_signal: true
  stage_attr: diffusion
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.hunyuan_video10.conditions.HunyuanVideo10Conditions
  params: ${sampling}
  reference_nu: 0.8
  kl_mask_threshold: 1.0e-05
  timestep_chunk_size: 1
stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  num_updates_per_batch: 2
  shuffle_updates: true
data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: ${oc.env:DATA_PATH}
      eval_data_path: ${oc.env:EVAL_DATA_PATH,${oc.env:DATA_PATH}}
      seed: ${sampling.seed}
    algorithm:
      prompts_per_rollout: ${batch_size}
sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  cache_art_old_predictions: true
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 720
  width: 1280
  num_frames: 5
  eta: 0.0
  samples_per_prompt: 8
  seed: 42
  init_same_noise: false
  scheduler:
    _target_: unirl.sde.index_schedule.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    timestep_fraction:
    - 0.0
    - 1.0
    num_sde_steps: null
weight_sync_interval: 1
