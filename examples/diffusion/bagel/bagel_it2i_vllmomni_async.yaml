# @package _global_
# Dynamic prompt-lane BAGEL it2i + per-prompt asynchronous managed EditReward.
#
# This recipe inherits PR304's model, it2i adapter, data, algorithm, and exact
# EditReward configuration. It changes only role placement and scheduling:
#   lane generate -> immediate RewardService HTTP /score -> scored queue
#   -> collect batch_size complete prompt groups -> train.
#
# Default geometry uses a dedicated reward card:
#   4 train + 4 rollout + 1 managed EditReward.
#   BAGEL_PATH=... EDITREWARD_PYTHON=... EDITREWARD_CHECKPOINT=... \
#   EDITREWARD_BASE_MODEL=... \
#   python -m unirl.train_async_diffusion \
#     --config-name diffusion/bagel/bagel_it2i_vllmomni_async

defaults:
  - bagel_it2i_vllmomni
  - _self_

num_devices: 9
# WARNING: with devices_per_node=8, this requests STRICT_PACK groups of 8+1
# GPUs and therefore needs capacity on at least two nodes (unless one node has
# 9 GPUs available).
layout: separate
train_fraction: 0.4444444444444444
reward_fraction: 0.1111111111111111

# PR289 prompt-unit scheduling. Diffusion keeps one admitted batch-equivalent so
# all groups in a training batch share one rollout_id and one SDE schedule.
max_inflight: 1
per_worker_inflight: 1
weight_sync_interval: 1
async_reward: true

# Train, rollout, and the single managed reward child remain resident on three
# disjoint GPU slabs, so reward HTTP work can overlap optimizer updates.
offload_train_during_reward: false
rollout_sleep_after_generate: false

logging:
  run_name: bagel_it2i_vllmomni_async_editreward
  tags: [bagel, it2i, editreward, vllmomni, async, dynamic-dispatch]

rollout:
  config:
    enable_sleep_mode: false

# Separate train/rollout slabs require cross-worker LoRA publication.
sync:
  _target_: unirl.distributed.weight_sync.lora.RemoteLoraWeightSync
