# @package _global_
# Async BAGEL it2i with EditReward served remotely over HTTP instead of using
# the managed scorer child inherited from bagel_it2i_vllmomni_async.
#
# Each completed prompt group starts its own asynchronous /score request:
#   lane generate -> release lane + start remote score -> scored queue
#   -> collect batch_size scored prompt groups -> train.
#
# Geometry: num_devices=8 -> 4 train + 4 rollout. The scorer model lives on a
# separate node, while the thin HTTP reward client runs on the driver and uses
# no GPU worker or reward slab.
#
# Deploy: the reward node runs configs/editreward_service.yaml; the train node:
#   REWARD_SERVICE_URL=http://<reward_node_ip>:8080
#   python -m unirl.train_async_diffusion \
#     --config-name diffusion/bagel/bagel_it2i_vllmomni_async_remote

defaults:
  - bagel_it2i_vllmomni_async
  - _self_

# All 8 local GPUs are train+rollout (4+4); no local reward card is allocated.
num_devices: 8
train_fraction: 0.5
reward_fraction: 0.0
reward_client_on_driver: true

# Inherited async_reward=true sends each completed prompt group immediately.
# Weight publication cadence and admissible rollout lag remain independent.
weight_sync_interval: 1
buffer_max_staleness: 2

# Define a complete replacement tree so inherited ManagedScorerProcessSpec keys
# cannot merge into the remote backend configuration.
remote_reward:
  _target_: unirl.reward.service.RewardService
  backend:
    _target_: unirl.reward.remote.RemoteRewardBackend
    base_device: cpu
    config:
      _target_: unirl.reward.remote.RemoteRewardSpec
      base_url: ${oc.env:REWARD_SERVICE_URL,http://localhost:8080}
      required_rewards: [editreward]
      reward_weights: {editreward: 1.0}
      batch_size: 8
      request_batch_size: 8
      timeout: 300.0
      sub_metric_reduce: first
      aggregation_method: weighted_sum
      input_kind: image

reward: ${remote_reward}

logging:
  run_name: bagel_it2i_async_remote_editreward
