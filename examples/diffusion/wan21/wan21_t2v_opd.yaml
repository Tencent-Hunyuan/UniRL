# @package _global_
# Synchronous WAN2.1 LoRA OPD: independent CFG=6 teacher, CFG=1 student.
# Both read the same Diffusers checkpoint; only the student owns text/VAE weights.
# Teacher CFG uses the existing zero-negative fallback; see examples/README.md.

num_devices: 2
devices_per_node: ${num_devices}
batch_size: ${num_devices}
num_rollouts: 20
accumulate_rollouts: 1
eval_interval: 0
save_interval: 10
save_mode: auto
save_dir: ${oc.env:D4_SAVE_DIR,checkpoints/wan21_opd}
layout: colocate

bundle:
  _target_: unirl.models.wan21.bundle.WAN21Bundle.from_config
  config:
    _target_: unirl.models.wan21.config.WAN21PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,Wan-AI/Wan2.1-T2V-1.3B-Diffusers}
    model_precision: bf16
    shift: 5.0
    max_sequence_length: 512

pipeline:
  _target_: unirl.models.wan21.pipeline.WAN21Pipeline
  shift: 5.0
  autocast_precision: bf16
  trajectory_precision: fp16
  logprob_precision: fp32
  max_sequence_length: 512
  batch_replay_steps: false
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: [WanTransformerBlock]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    cast_forward_inputs: false
    checkpoint_format: dcp
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: false
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: ${num_rollouts}
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 64
    alpha: 128
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - attn1.to_q
      - attn1.to_k
      - attn1.to_v
      - attn1.to_out.0
      - attn2.to_q
      - attn2.to_k
      - attn2.to_v
      - attn2.to_out.0

rollout:
  _target_: unirl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs: [diffusion]
  forward_batch_size: 1

algorithm:
  _target_: unirl.algorithms.diffusionopd.DiffusionOPD
  stage_attr: diffusion
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.wan21.conditions.WAN21Conditions
  params: ${sampling}
  add_kl_coefficient: false
  teacher_provider:
    _target_: unirl.algorithms.diffusionopd.FullModelTeacherProvider
    name: wan21_cfg
    guidance_scale: 6.0
    device: cuda
    dtype: bf16
    offload_to_cpu: true
    model:
      _target_: unirl.models.wan21.bundle.WAN21Bundle.from_config
      config:
        _target_: unirl.models.wan21.config.WAN21PipelineConfig
        pretrained_model_ckpt_path: ${bundle.config.pretrained_model_ckpt_path}
        model_precision: bf16
        device: cpu
        load_vae: false
        load_text_encoder: false
        meta_init_transformer: false

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  num_updates_per_batch: 1

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: ${oc.env:DATA_PATH,datasets/pickscore/train.txt}
      eval_data_path: ${oc.env:EVAL_DATA_PATH,datasets/pickscore/test.txt}
      seed: 42
      shuffle: false
    algorithm:
      prompts_per_rollout: ${batch_size}

sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 4
  guidance_scale: 1.0
  height: 256
  width: 256
  num_frames: 5
  eta: 1.0e-6
  samples_per_prompt: 1
  seed: 42
  init_same_noise: false
  scheduler:
    _target_: unirl.sde.index_schedule.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    timestep_fraction: [0.0, 0.99]
    num_sde_steps: null

logging:
  report_to_wandb: false
  project_name: ${oc.env:WANDB_PROJECT,unirl-wan21-opd}
  run_name: wan21_opd_cfg
  tags: [wan21, t2v, opd, cfg, single-teacher]
  log_media: false
