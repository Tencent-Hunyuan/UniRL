# @package _global_
# Fresh CLAP-only objective; micro-batch 4 retry after the micro-batch 8 OOM.
# 32 prompts x 8 samples = 256 samples/rollout; 2 updates of 128 samples each.
# Eight GPUs: micro-batch 4 x 4 accumulation micros per update on each GPU.
# Rollout forward batch stays 2; global optimizer batch remains 128.
# 150 rollouts = 300 optimizer updates; no baseline or periodic evaluation.
# Joint AV policy/LoRA and CPS parameters match the existing CLAP-only comparison.
# No advantage clipping; SDE steps use unirl's native AllSDEScheduler, restricted
# to the same first-10-of-24-step pool the old LTX2VerlIndexScheduler sampled
# from (3 random indices out of [0, 10)), reseeded per rollout step.

num_devices: 8
batch_size: 32
adv_use_global_std: true
num_rollouts: 150
load_dir: null
eval_interval: 0
save_interval: 10
save_dir: ${oc.env:LTX_CLAP_HIGHBATCH_SAVE_DIR,checkpoints/ltx23_verl_cps_clap_p32g8_u300_noeval}
save_mode: adapter
logging:
  report_to_wandb: true
  project_name: ${oc.env:WANDB_PROJECT,leo2_traing}
  run_name: ${oc.env:WANDB_RUN_NAME,ltx23-clap-only-p32g8-mb4-n24-cfg4-cps08-allsde3-noclip-lr3e4-r64a128-f81-u300-noeval}
  entity: ${oc.env:WANDB_ENTITY,boyeniu-the-university-of-sydney}
  tags:
  - ltx2.3
  - verl-reference
  - cps
  - clap-only
  - highbatch32
  - joint-av
  - allsde
  - noclip
  - noeval
  log_media: true
  media_max_items: 4
  media_log_interval: 10
bundle:
  _target_: unirl.models.ltx2.bundle.LTX2Bundle.from_config
  config:
    _target_: unirl.models.ltx2.config.LTX2PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,diffusers/LTX-2.3-Diffusers}
    model_precision: bf16
    autocast_precision: bf16
    trajectory_precision: bf16
    logprob_precision: fp32
    shift: 1.0
    max_sequence_length: 1024
    enable_audio: true
    audio_joint_sde: true
    audio_policy_logp_weight: null
    default_height: ${sampling.height}
    default_width: ${sampling.width}
    default_num_frames: ${sampling.num_frames}
    default_frame_rate: 24.0
pipeline:
  _target_: unirl.models.ltx2.pipeline.LTX2Pipeline.from_bundle
  config: ${bundle.config}
  strategy:
    _target_: unirl.sde.kernels.CPSSDEStrategy
backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names:
  - LTX2VideoTransformerBlock
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    master_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 0.0003
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-08
    weight_decay: 0.0001
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 300
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 64
    alpha: 128
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
    - attn1.to_q
    - attn1.to_k
    - attn1.to_v
    - attn1.to_out.0
    - attn2.to_q
    - attn2.to_k
    - attn2.to_v
    - attn2.to_out.0
    - audio_attn1.to_q
    - audio_attn1.to_k
    - audio_attn1.to_v
    - audio_attn1.to_out.0
    - audio_attn2.to_q
    - audio_attn2.to_k
    - audio_attn2.to_v
    - audio_attn2.to_out.0
    - audio_to_video_attn.to_q
    - audio_to_video_attn.to_k
    - audio_to_video_attn.to_v
    - audio_to_video_attn.to_out.0
    - video_to_audio_attn.to_q
    - video_to_audio_attn.to_k
    - video_to_audio_attn.to_v
    - video_to_audio_attn.to_out.0
    - ff.net.0.proj
    - ff.net.2
    - audio_ff.net.0.proj
    - audio_ff.net.2
rollout:
  _target_: unirl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs:
  - diffusion
  forward_batch_size: 2
reward:
  _target_: unirl.reward.service.RewardService
  backend:
    _target_: unirl.reward.local.clap.CLAPRewardScorer
    base_device: cuda
    config:
      _target_: unirl.reward.local.clap.CLAPSpec
      batch_size: 4
      device: auto
      model_id: laion/larger_clap_general
      matched_cosine_weight: 1.0
      retrieval_margin_weight: 0.0
algorithm:
  _target_: unirl.algorithms.flowgrpo.FlowGRPO
  stage_attr: diffusion
  clip_range: 0.0001
  clip_schedule: constant
  old_logp_source: replay
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.ltx2.conditions.LTX2Conditions
  params: ${sampling}
stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 4
  max_grad_norm: 1.0
  num_updates_per_batch: 2
data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: ${oc.env:LTX_VERL_DATA_PATH,data/vidprom_verl_reference/train.txt}
      eval_data_path: null
      seed: 42
      shuffle: true
    algorithm:
      prompts_per_rollout: ${batch_size}
sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 24
  guidance_scale: 4.0
  height: 256
  width: 384
  num_frames: 81
  eta: 0.8
  samples_per_prompt: 8
  seed: 42
  init_same_noise: false
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  scheduler:
    _target_: unirl.sde.index_schedule.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    # int(24 * 10/24) == 10, so this pins the pool to indices [0, 10) exactly,
    # matching the old LTX2VerlIndexScheduler's window.
    timestep_fraction: 0.4166666666666667
    num_sde_steps: 3
  max_sequence_length: 1024
