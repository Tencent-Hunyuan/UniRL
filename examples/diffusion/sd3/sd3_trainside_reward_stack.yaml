# @package _global_
# sd3_trainside with the reward stack: the colocate control for sd3_trainside_http_reward_stack.
# Colocated with PickScore there is little to win (reward is 3% of the step); the stack is for a
# reward that costs real time, i.e. one served from other GPUs.
# micro_batch_size matches rollout.forward_batch_size, so chunk boundaries and the per-step SDE
# noise draw order stay those of the baseline.

defaults:
  - sd3_trainside
  - _self_

reward_stack:
  _target_: unirl.reward.stack.RewardStack
  micro_batch_size: 16
  overlap: false

logging:
  tags: [sd3, flowgrpo, trainside, reward_stack]
