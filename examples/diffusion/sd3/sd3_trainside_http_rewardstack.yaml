# @package _global_
# sd3_trainside_http with the reward stack — the case the stack is actually for.
#
# Everything comes from sd3_trainside_http: same model, LoRA, rollout engine, remote
# reward, algorithm, data and sampling. Inheriting is safe here because this file only
# ADDS `rewardstack:`; it does not replace a subtree, which is why sd3_trainside_http is
# a standalone copy and this one is not.
#
# Measured against sd3_trainside_http on 6 train GPUs + PickScore on a 7th over loopback:
# generate+reward 62.58 s -> 52.40 s and step 157.2 s -> 144.7 s at `overlap: false`.
# Moving the scorer off the rollout cards is what creates the prize — reward goes from
# 3.12 s colocated to 15.97 s here, 2.9% of the step to 10.2%.
#
# `overlap: true` adds a scoring thread on top. It improved the phase it targets by
# 2.79 s but step time did not follow (that arm's train ran 4.34 s high, which the reward
# path cannot cause), so on one run per arm it is unproven and stays opt-in.
#
# WHY the serial micro loop already wins is NOT established. Two mechanisms are
# confounded in the baseline->micro comparison and this experiment cannot apportion them:
# request size (one 128-image POST becomes eight of 16) and arrival synchronization (the
# driver's generate-then-score barrier disappears, so ranks may drift and keep the scorer
# busy). `gain = [6*W(128) - 48*W(16)] + H`; the first term needs the per-request cost to
# be super-linear in batch, the second needs the ranks to actually drift. Setting
# `RemoteRewardSpec.request_batch_size: 16` on sd3_trainside_http isolates the first term
# and is the cheap way to settle it.
#
# micro_batch_size matches rollout.forward_batch_size (16), so the engine's own chunk loop
# stays inert and chunk boundaries match the baseline's. It also sets the POST size:
# 8 POSTs of 16 images instead of one of 128.
#
# Arms, wandb on, same +num_rollouts, all on GPUs 0-5 with one reward server on GPU 6 —
# never compare these against the colocated 8-GPU numbers, which differ in both topology
# and device count:
#   1. diffusion/sd3/sd3_trainside_http                                       baseline, one 128-image POST
#   2. diffusion/sd3/sd3_trainside_http_rewardstack                           8 POSTs of 16, serial
#   3. diffusion/sd3/sd3_trainside_http_rewardstack rewardstack.overlap=true  8 POSTs of 16, one in flight

defaults:
  - sd3_trainside_http
  - _self_

rewardstack:
  _target_: unirl.reward.stack.RewardStack
  micro_batch_size: 16          # = sd3_trainside_http rollout.forward_batch_size
  overlap: false        # measured default; true is opt-in and unproven — see the reward README

logging:
  tags: [sd3, flowgrpo, trainside, rewardstack, http]
