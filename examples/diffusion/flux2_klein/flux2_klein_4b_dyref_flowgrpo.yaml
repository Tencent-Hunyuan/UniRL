# @package _global_
# DyRef stage II: FLUX.2-klein-4B fixed-N trainside RL with DRS + DAR.
#
# Cook a uniform-N manifest with datasets/dyref/prepare_dyref.py
# --reference-count N. One GPU serves SigLIPv2 + CSD; seven GPUs share
# FSDP training and trainside rollout. SFT_ADAPTER_PATH is the PEFT folder
# exported from the matching stage-I checkpoint.

num_devices: 8
batch_size: 7
reward_fraction: 0.125
num_rollouts: 10000
save_interval: 100
save_dir: ${oc.env:SAVE_DIR,checkpoints/flux2_klein_4b_dyref_rl}
save_mode: adapter
eval_interval: 0
adv_use_global_std: false

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,false}}
  project_name: ${oc.env:WANDB_PROJECT,unirl-dyref}
  run_name: ${oc.env:WANDB_RUN_NAME,flux2_klein_4b_dyref_rl}
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [dyref, flux2-klein-4b, flowgrpo, drs, dar, csd, siglip2]
  log_media: true
  media_max_items: 8
  media_log_interval: 1

bundle:
  _target_: unirl.models.flux2_klein.bundle.Flux2KleinBundle.from_config
  config:
    _target_: unirl.models.flux2_klein.config.Flux2KleinPipelineConfig
    pretrained_model_ckpt_path: ${oc.env:FLUX2_KLEIN_PATH,black-forest-labs/FLUX.2-klein-base-4B}
    model_precision: bf16
    max_sequence_length: 512
    condition_image_resize_mode: crop
    shift: 1.0

pipeline:
  _target_: unirl.models.flux2_klein.pipeline.Flux2KleinPipeline
  shift: 1.0
  autocast_precision: bf16
  trajectory_precision: fp16
  logprob_precision: fp32
  max_sequence_length: 512
  qwen3_extraction_layers: [9, 18, 27]
  condition_image_resize_mode: crop
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["Flux2TransformerBlock", "Flux2SingleTransformerBlock"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    master_dtype: fp32
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 1.0e-4
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: ${num_rollouts}
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 32
    alpha: 32
    initial_adapter_path: ${oc.env:SFT_ADAPTER_PATH}
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - to_q
      - to_k
      - to_v
      - to_out.0
      - add_q_proj
      - add_k_proj
      - add_v_proj
      - to_add_out
      - ff.linear_in
      - ff.linear_out
      - ff_context.linear_in
      - ff_context.linear_out
      - to_qkv_mlp_proj

rollout:
  _target_: unirl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs: [diffusion]
  forward_batch_size: 8

reward:
  _target_: unirl.reward.service.RewardService
  backend:
    _target_: unirl.reward.local.dyref.DyRefRewardScorer
    base_device: cuda
    config:
      _target_: unirl.reward.local.dyref.DyRefRewardSpec
      semantic:
        _target_: unirl.reward.local.dyref.SigLIPSimilaritySpec
        batch_size: 8
        device: auto
        dtype: bf16
        model_id: ${oc.env:SIGLIP2_PATH,google/siglip2-base-patch16-384}
        feature_mode: flat
        apply_drs: true
        drs_threshold: 0.65
        drs_k1: 10.0
        drs_k2: 3.0
        drs_min_references: 3
      style:
        _target_: unirl.reward.local.dyref.CSDStyleSpec
        batch_size: 8
        device: auto
        checkpoint_path: ${oc.env:CSD_CHECKPOINT}
        clip_download_root: ${oc.env:CSD_CLIP_CACHE,null}
      semantic_weight: 1.0
      style_weight: 0.8
      dar_gamma: 2.0
      dar_min_weight: 0.01
      dar_max_weight: 5.0

algorithm:
  _target_: unirl.algorithms.flowgrpo.DyRefFlowGRPO
  stage_attr: diffusion
  clip_range: 1.0e-4
  clip_schedule: constant
  beta: 0.04
  old_logp_source: replay
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.flux2_klein.conditions.Flux2KleinConditions
  params: ${sampling}

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  num_updates_per_batch: 2

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: ${oc.env:DATA_PATH,data/dyref_n3/train.jsonl}
      eval_data_path: ${oc.env:EVAL_DATA_PATH,data/dyref_n3/val.jsonl}
      seed: 42
    algorithm:
      prompts_per_rollout: ${batch_size}

sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 10
  guidance_scale: 4.0
  height: 512
  width: 512
  eta: 1.0
  samples_per_prompt: 24
  seed: 42
  init_same_noise: false
  scheduler:
    _target_: unirl.sde.index_schedule.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    num_sde_steps: 1
    timestep_fraction: [0.1, 0.4]
