# @package _global_
# DyRef stage I: FLUX.2-klein-4B fixed-N multi-reference flow-matching SFT.
#
# FLUX.2 consumes dense reference slots, so every worker batch must have one
# reference count. Bucket the converted DyRef manifest by metadata.dyref.reference_count
# before training; mixed counts fail at Flux2KleinVAEEncodeStage.

num_devices: 8
batch_size: 32
num_steps: 10000
eval_interval: 100
eval_batch_size: 16
eval_num_samples: 128
save_interval: 500
save_dir: ${oc.env:SAVE_DIR,checkpoints/flux2_klein_4b_dyref_sft}
save_mode: adapter

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,false}}
  project_name: ${oc.env:WANDB_PROJECT,unirl-dyref}
  run_name: ${oc.env:WANDB_RUN_NAME,flux2_klein_4b_dyref_sft}
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [dyref, sft, flux2-klein-4b, multi-reference, lora]

bundle:
  _target_: unirl.models.flux2_klein.bundle.Flux2KleinBundle.from_config
  config:
    _target_: unirl.models.flux2_klein.config.Flux2KleinPipelineConfig
    pretrained_model_ckpt_path: ${oc.env:FLUX2_KLEIN_PATH,black-forest-labs/FLUX.2-klein-base-4B}
    model_precision: bf16
    max_sequence_length: 512
    condition_image_resize_mode: crop
    shift: 1.0

pipeline:
  _target_: unirl.models.flux2_klein.pipeline.Flux2KleinPipeline
  shift: 1.0
  autocast_precision: bf16
  trajectory_precision: fp16
  logprob_precision: fp32
  max_sequence_length: 512
  qwen3_extraction_layers: [9, 18, 27]
  condition_image_resize_mode: crop
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["Flux2TransformerBlock", "Flux2SingleTransformerBlock"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    master_dtype: fp32
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: ${num_steps}
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 32
    alpha: 32
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - to_q
      - to_k
      - to_v
      - to_out.0
      - add_q_proj
      - add_k_proj
      - add_v_proj
      - to_add_out
      - ff.linear_in
      - ff.linear_out
      - ff_context.linear_in
      - ff_context.linear_out
      - to_qkv_mlp_proj

algorithm:
  _target_: unirl.algorithms.sft.FlowMatchSFT
  stage_attr: diffusion
  timestep_sampling: uniform
  timestep_shift: 1.0
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.flux2_klein.conditions.Flux2KleinConditions
  params: ${sampling}

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 2
  max_grad_norm: 1.0

track_builder:
  _target_: unirl.train.sft.track_builder.DiffusionSupervisedTrackBuilder
  encode_stage_attr: target_vae_encode
  height: 512
  width: 512
  guidance_scale: 1.0

data_source:
  _target_: unirl.data.sft.SupervisedDataSource
  manifest_path: ${oc.env:SFT_DATA,data/dyref_n3/train.jsonl}
  eval_manifest_path: ${oc.env:SFT_EVAL_DATA,data/dyref_n3/val.jsonl}
  seed: 42

sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 512
  width: 512
