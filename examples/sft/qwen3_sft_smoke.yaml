# @package _global_
# Qwen3 SFT (supervised finetuning) — autoregressive next-token cross-entropy.
#
# The AR half of the SFT-domain validation pair (the diffusion half is
# sd3_sft_smoke.yaml). Same generic skeleton (unirl.train_sft ->
# SFTTrainer -> SFTPolicy), swapped task_target + model_config; the loss
# (masked next-token CE) lives entirely in Qwen3SFTTask. LoRA keeps the 4B
# smoke light. Launch:
#   ray start --head
#   RAY_ADDRESS=auto python -m unirl.train_sft --config-name sft/qwen3_sft_smoke
#
# Manifest rows (JSONL): {"sample_id": str, "prompt": str, "response": str}

num_devices: 8
batch_size: 8            # prompts per step; must be divisible by policy dp
num_rollouts: 100
max_grad_norm: 1.0
eval_interval: 20
eval_num_samples: 2
save_interval: 0

policy:
  _target_: unirl.train.sft.policy.SFTPolicy
  task_target: unirl.models.qwen3.sft_task.Qwen3SFTTask
  seed: 42
  block_class_names: ["Qwen3DecoderLayer"]
  model_config:
    _target_: unirl.models.qwen3.config.Qwen3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,Qwen/Qwen3-4B}
    model_precision: bf16
    autocast_precision: bf16
    logprob_precision: fp32
    attn_implementation: sdpa       # flash/sdpa only (see _replay_aware_forward)
    use_gradient_checkpointing: true
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    root_wrap: true
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: ${num_rollouts}
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 32
    alpha: 64
    dropout: 0.0
    bias: none
    task_type: CAUSAL_LM
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj

data_source:
  _target_: unirl.train.sft.data.JsonlSFTDataSource
  manifest_path: ${oc.env:DATA_PATH,datasets/sft/qwen3_train.jsonl}
  eval_manifest_path: ${oc.env:EVAL_DATA_PATH,datasets/sft/qwen3_eval.jsonl}
  seed: 42

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,true}}
  project_name: ${oc.env:WANDB_PROJECT,unirl-sft}
  run_name: ${oc.env:WANDB_RUN_NAME,qwen3_sft_smoke}
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: ["qwen3", "sft", "ar", "cross-entropy"]
  log_media: false
