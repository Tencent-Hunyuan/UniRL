# @package _global_
# WAN 2.1 T2V-1.3B full-transformer SFT on an 18-class sports/action
# subset of UCF-101.
#
# Download/cook guide:
#   datasets/ucf101/README.md
#
# Train:
#   ENTRY=train_sft SFT_DATA=datasets/ucf101/processed/train.jsonl \
#   SFT_EVAL_DATA=datasets/ucf101/processed/val.jsonl \
#   OUTPUT_DIR=outputs/wan21_t2v_ucf101_full \
#   bash examples/run_experiment_single_node.sh sft/wan21_t2v_ucf101_full

num_devices: 8
batch_size: 8
num_steps: 300
eval_interval: 20
eval_batch_size: 8
eval_num_samples: 128
save_interval: 100
save_dir: ${oc.env:OUTPUT_DIR,outputs/wan21_t2v_ucf101_full}
save_mode: full
transport_kind: colocate_store
workers_per_device: 1

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,false}}
  project_name: ${oc.env:WANDB_PROJECT,unirl-sft}
  run_name: ${oc.env:WANDB_RUN_NAME,wan21_ucf101_sports_full}
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [sft, wan21, t2v, video, ucf101, sports, full]

bundle:
  _target_: unirl.models.wan21.bundle.WAN21Bundle.from_config
  config:
    _target_: unirl.models.wan21.config.WAN21PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,Wan-AI/Wan2.1-T2V-1.3B-Diffusers}
    model_precision: bf16
    shift: 5.0
    max_sequence_length: 512
    load_vae: true
    meta_init_transformer: true

pipeline:
  _target_: unirl.models.wan21.pipeline.WAN21Pipeline
  shift: 5.0
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  max_sequence_length: 512
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["WanTransformerBlock"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    master_dtype: fp32
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 2.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_epsilon: 1.0e-8
    weight_decay: 1.0e-4
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 50
    total_steps: ${num_steps}

algorithm:
  _target_: unirl.algorithms.sft.FlowMatchSFT
  stage_attr: diffusion
  timestep_sampling: logit_normal
  timestep_shift: 5.0
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.wan21.conditions.WAN21Conditions
  params: ${sampling}

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0

track_builder:
  _target_: unirl.train.sft.track_builder.VideoDiffusionSupervisedTrackBuilder
  num_frames: 17
  height: 256
  width: 448
  guidance_scale: 1.0
  max_decode_frames: 256

data_source:
  _target_: unirl.data.sft.SupervisedDataSource
  manifest_path: ${oc.env:SFT_DATA}
  eval_manifest_path: ${oc.env:SFT_EVAL_DATA,${oc.env:SFT_DATA}}
  seed: 42

sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 14
  guidance_scale: 1.0
  height: 256
  width: 448
  num_frames: 17
