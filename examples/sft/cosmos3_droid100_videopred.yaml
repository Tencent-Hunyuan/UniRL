# @package _global_
# Cosmos3-Nano video-prediction SFT on droid_100: clean observation frame 0,
# then flow-match the next 16 frames through the shared SFT stack.

num_devices: 8
batch_size: 8
num_steps: 200
eval_interval: 50
eval_batch_size: 8
eval_num_samples: 8
save_interval: 100
save_mode: auto
save_dir: ${oc.env:SAVE_DIR,outputs/cosmos3_droid100_videopred}
transport_kind: colocate_store
workers_per_device: 1

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,false}}
  project_name: ${oc.env:WANDB_PROJECT,unirl-sft}
  run_name: ${oc.env:WANDB_RUN_NAME,cosmos3_droid100_videopred}
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [cosmos3, sft, videopred, droid100]

bundle:
  _target_: unirl.models.cosmos3.bundle.Cosmos3Bundle.from_config
  config:
    _target_: unirl.models.cosmos3.config.Cosmos3SFTConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,nvidia/Cosmos3-Nano}
    model_precision: bf16
    master_precision: fp32
    vae_precision: fp32
    freeze_understanding: true
    time_dist: logitnormal
    fps: 15.0
    condition_on_first_frame: true
    vision_loss_weight: 1.0

pipeline:
  _target_: unirl.models.cosmos3.pipeline.Cosmos3Pipeline

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: [Cosmos3VLTextMoTDecoderLayer]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 10
    total_steps: ${num_steps}
  lora_cfg: null

algorithm:
  _target_: unirl.algorithms.cosmos3_sft.Cosmos3JointFlowMatchSFT
  stage_attr: joint
  eval_seed: 42

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0

track_builder:
  _target_: unirl.train.sft.cosmos3.Cosmos3SupervisedTrackBuilder
  train_action: false

data_source:
  _target_: unirl.data.sft.SupervisedDataSource
  manifest_path: ${oc.env:SFT_DATA,datasets/droid100_debug/manifest.jsonl}
  eval_manifest_path: ${oc.env:SFT_EVAL_DATA,datasets/droid100_debug/eval_manifest.jsonl}
  seed: 42
