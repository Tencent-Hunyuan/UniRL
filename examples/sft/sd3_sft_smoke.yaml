# @package _global_
# SD3.5 SFT (supervised finetuning) — diffusion flow-matching velocity MSE.
#
# The diffusion half of the SFT-domain validation pair (the AR half is
# qwen3_sft_smoke.yaml). Identical skeleton (unirl.train_sft -> SFTTrainer ->
# SFTPolicy), swapped task_target + model_config; the loss (flow-matching
# MSE, target = noise - x0) lives entirely in SD3SFTTask. LoRA keeps the smoke
# light. Launch:
#   ray start --head
#   RAY_ADDRESS=auto python -m unirl.train_sft --config-name sft/sd3_sft_smoke
#
# Manifest rows (JSONL): {"sample_id": str, "image_path": str, "prompt": str}
# image_path is relative to the manifest directory.

num_devices: 8
batch_size: 8            # image/prompt pairs per step; divisible by policy dp
num_rollouts: 100
max_grad_norm: 1.0
eval_interval: 20
eval_num_samples: 2
save_interval: 0

policy:
  _target_: unirl.train.sft.policy.SFTPolicy
  task_target: unirl.models.sd3.sft_task.SD3SFTTask
  seed: 42
  block_class_names: ["JointTransformerBlock"]
  model_config:
    _target_: unirl.models.sd3.config.SD3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    model_precision: bf16
    autocast_precision: bf16
    logprob_precision: fp32
    shift: 3.0
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    root_wrap: true
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: ${num_rollouts}
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 32
    alpha: 64
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_out.0
      - attn.to_q
      - attn.to_v

data_source:
  _target_: unirl.train.sft.data.JsonlSFTDataSource
  manifest_path: ${oc.env:DATA_PATH,datasets/sft/sd3_train.jsonl}
  eval_manifest_path: ${oc.env:EVAL_DATA_PATH,datasets/sft/sd3_eval.jsonl}
  seed: 42

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,true}}
  project_name: ${oc.env:WANDB_PROJECT,unirl-sft}
  run_name: ${oc.env:WANDB_RUN_NAME,sd3_sft_smoke}
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: ["sd3.5", "sft", "diffusion", "flow-matching"]
  log_media: false
