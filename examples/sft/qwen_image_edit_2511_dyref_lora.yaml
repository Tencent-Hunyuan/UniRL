# @package _global_
# DyRef stage I: Qwen-Image-Edit-2511 multi-reference flow-matching SFT.
#
# Prepare one manifest for both SFT and RL:
#   python datasets/dyref/prepare_dyref.py --input <train_data.json> \
#     --data-root <extracted-root> --out-dir data/dyref
#
# Launch:
#   ENTRY=train_sft SFT_DATA=data/dyref/train.jsonl SFT_EVAL_DATA=data/dyref/val.jsonl \
#     bash examples/run_experiment_single_node.sh sft/qwen_image_edit_2511_dyref_lora

num_devices: 8
batch_size: 8
num_steps: 10000
eval_interval: 100
eval_batch_size: 8
eval_num_samples: 128
save_interval: 500
save_dir: ${oc.env:SAVE_DIR,checkpoints/qwen_image_edit_2511_dyref_sft}
save_mode: adapter

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,false}}
  project_name: ${oc.env:WANDB_PROJECT,unirl-dyref}
  run_name: ${oc.env:WANDB_RUN_NAME,qwen_image_edit_2511_dyref_sft}
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [dyref, sft, qwen-image-edit-2511, multi-reference, lora]

bundle:
  _target_: unirl.models.qwen_image_edit_plus.bundle.QwenImageEditPlusBundle.from_config
  config:
    _target_: unirl.models.qwen_image_edit_plus.config.QwenImageEditPlusPipelineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN_IMAGE_EDIT_PLUS_PATH,Qwen/Qwen-Image-Edit-2511}
    model_precision: bf16
    max_sequence_length: 1024
    use_condition_image_prompt: true
    shift: 3.0

pipeline:
  _target_: unirl.models.qwen_image_edit_plus.pipeline.QwenImageEditPlusPipeline
  shift: 3.0
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  max_sequence_length: 1024
  use_condition_image_prompt: true
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["QwenImageTransformerBlock"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    master_dtype: fp32
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: ${num_steps}
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 64
    alpha: 64
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - to_q
      - to_k
      - to_v
      - to_out.0
      - add_q_proj
      - add_k_proj
      - add_v_proj
      - to_add_out
      - img_mlp.net.2
      - img_mod.1
      - txt_mlp.net.2
      - txt_mod.1

algorithm:
  _target_: unirl.algorithms.sft.FlowMatchSFT
  stage_attr: diffusion
  timestep_sampling: uniform
  timestep_shift: 1.0
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.qwen_image_edit_plus.conditions.QwenImageEditPlusConditions
  params: ${sampling}

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0

track_builder:
  _target_: unirl.train.sft.track_builder.DiffusionSupervisedTrackBuilder
  encode_stage_attr: target_vae_encode
  height: 512
  width: 512
  guidance_scale: 1.0

data_source:
  _target_: unirl.data.sft.SupervisedDataSource
  manifest_path: ${oc.env:SFT_DATA,data/dyref/train.jsonl}
  eval_manifest_path: ${oc.env:SFT_EVAL_DATA,data/dyref/val.jsonl}
  seed: 42

sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 512
  width: 512
