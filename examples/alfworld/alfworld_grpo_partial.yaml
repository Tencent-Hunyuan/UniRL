# @package _global_
# LIN-531 — Colocate PARTIAL-ROLLOUT ALFWorld: AgenticEnvPartialTrainer, COLOCATE (train + rollout
# time-share each GPU, TensorWeightSync). The synchronous partial-rollout sibling of alfworld_grpo.yaml
# (barrier AgenticEnvTrainer). Over-samples ALFWorld episodes, commits the fastest `batch_size` complete
# GRPO groups, and `abort`s the slow tail at a turn boundary. `tail_policy: drop` because ALFWorld is a
# stateful-episode env (a carried partial restarts on reset) — dropping still cuts the 15-turn straggler
# while keeping ALL GPUs for generation. This is the sweet spot the disaggregated async trainer missed on
# ALFWorld (it halved the generation GPUs). Head-to-head vs alfworld_grpo.yaml (barrier) and
# alfworld_grpo_async.yaml (async) for the LIN-531 speed comparison.
#
# Run (single node, whole 8-GPU node):
#   QWEN3_INSTRUCT_PATH=... ALFWORLD_DATA=... DATA_PATH=data/alfworld/train.jsonl \
#   python -m unirl.train_agentic_env_partial --config-name=alfworld/alfworld_grpo_partial num_devices=8

num_devices: 8
batch_size: 8 # P complete GRPO groups (games) committed per rollout step
num_rollouts: 30
weight_sync_interval: 1
eval_interval: 0

# ---- partial-rollout knobs (LIN-531) ----
oversample_batch_size: 12 # generate 12 games/drive; commit the fastest 8 → 4 slow games' tail aborted
buffer_max_staleness: 2 # a buffered group may cross up to 2 weight syncs before eviction
tail_policy: drop # ALFWorld reset starts a fresh episode → a carried partial restarts, so DROP it

# Colocate partial oversubscribes rank 0: its own run_drain + every worker's next_task pull +
# the poll→drain_completed fan + submit/abort/sync all ride these threaded-actor slots. Give it
# generous headroom (barrier only needs 8 because it never poll-fans).
worker_max_concurrency: 24
stop: null # ALFWorld actions are free text; rely on per-turn max_new_tokens
adv_normalization_scope: group
normalize_adv_by_std: true

logging:
  report_to_wandb: false
  project_name: unirl-alfworld
  run_name: alfworld_grpo_qwen3_partial
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [alfworld, agentic, multi-turn, env-reward, grpo, qwen3, partial-rollout, colocate, drop, lin-531]

bundle:
  _target_: unirl.models.qwen3.bundle.Qwen3Bundle.from_config
  config:
    _target_: unirl.models.qwen3.config.Qwen3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN3_INSTRUCT_PATH,Qwen/Qwen3-4B-Instruct}
    model_precision: fp32
    use_gradient_checkpointing: true
    attn_implementation: flex_attention

pipeline:
  _target_: unirl.models.qwen3.pipeline.Qwen3Pipeline.from_bundle
  enable_thinking: false
  autocast_precision: bf16
  logprob_precision: fp32

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["Qwen3DecoderLayer"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
    forward_prefetch: false
    defer_grad_sync: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.01
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 1000

rollout:
  _target_: unirl.rollout.engine.agentic.engine.AgenticRolloutEngine
  config:
    _target_: unirl.rollout.engine.agentic.config.AgenticRolloutEngineConfig
    max_turns: 15 # ALFWorld is long-horizon; the variable depth the partial commit-N exploits
    per_worker_concurrency: 8
    partial_rollout: true
    inner:
      _target_: unirl.rollout.engine.sglang.config.SGLangEngineConfig
      backend: native
      pretrained_model_ckpt_path: ${oc.env:QWEN3_INSTRUCT_PATH,Qwen/Qwen3-4B-Instruct}
      tp_size: 1
      max_new_tokens: 256
      temperature: 1.0
      top_p: 1.0
      concurrency: 8
      chat_template_kwargs:
        enable_thinking: false
      engine_kwargs:
        mem_fraction_static: 0.3 # colocate: shares the GPU with the FSDP train shard (sleep/wake)
        skip_server_warmup: true
        attention_backend: triton
        disable_cuda_graph: false
        cuda_graph_max_bs: 16
        enable_lora: false
    env:
      _target_: unirl.rollout.env.alfworld.AlfworldEnv
      split: train
      max_steps: 15 # keep == config.max_turns
      step_penalty: 0.0
      max_obs_chars: 1500
      config_file: ${oc.env:ALFWORLD_CONFIG,""}
    episode_sampling:
      _target_: unirl.types.sampling.ARSamplingParams
      samples_per_prompt: 8 # n — GRPO group (siblings share the same game)
      temperature: 1.0
      top_p: 1.0
      top_k: 0
      max_new_tokens: 256

reward:
  # BUILT BUT UNUSED — reward is env-sourced (AgenticEnvPartialTrainer reads the env return).
  _target_: unirl.reward.service.RewardService
  truncated_reward: keep
  backend:
    _target_: unirl.reward.local.mathverify.MathVerifyRewardScorer
    base_device: cpu
    config:
      _target_: unirl.reward.local.mathverify.MathVerifySpec

algorithm:
  _target_: unirl.algorithms.grpo.GRPO
  stage_attr: ar
  clip_range: 0.2
  clip_range_high: null
  clip_schedule: constant
  loss_agg_mode: seq-mean-token-mean
  horizon: 256
  sampling_temperature: 1.0
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.qwen3.conditions.Qwen3ARConditions

sync:
  _target_: unirl.distributed.weight_sync.full.tensor.TensorWeightSync
  lora_merged: false
  bucket_size_mb: 64
  flush_cache: true

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  num_updates_per_batch: 1

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: ${oc.env:DATA_PATH} # game-index rows: {"prompt": "", "metadata": {"game_index": i, "game_file": ...}}
      eval_data_path: ${oc.env:EVAL_DATA_PATH,${oc.env:DATA_PATH}}
      seed: 42
    algorithm:
      prompts_per_rollout: 12 # == oversample_batch_size (the per-drive game pool)

sampling:
  _target_: unirl.types.sampling.ARSamplingParams
  samples_per_prompt: 8 # MUST match episode_sampling
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  max_new_tokens: 256
