# @package _global_
# LIN-531 — Fully-async ALFWorld agentic RL: AsyncAgenticEnvTrainer, DISAGGREGATED.
# The async sibling of alfworld_grpo.yaml (colocate AgenticEnvTrainer barrier). ALFWorld
# episodes are variable-depth (2 vs 15 turns), so the synchronous barrier waits for the
# slowest episode each round; this async recipe overlaps generation with training on
# disjoint slabs, trains the FRESHEST complete GRPO groups (oversample > batch), and
# checkpoints the in-flight tail at a turn boundary on each NCCL weight sync (partial
# rollout). ALFWorld episodes are worker-local and checkpoint teardown closes them, so
# this recipe DROPS interrupted tails instead of pretending they can resume. Same env +
# reward SOURCE as the baseline; only the trainer/placement/sync differ.
#
# Prerequisites (on the pod): QWEN3_INSTRUCT_PATH, ALFWORLD_DATA (alfworld-download),
#   DATA_PATH (python -m unirl.utils.prepare_alfworld --out-dir data/alfworld).
#
# Run (single node, whole 8-GPU node; train_fraction=0.5 -> 4 train + 4 rollout):
#   QWEN3_INSTRUCT_PATH=... ALFWORLD_DATA=... DATA_PATH=data/alfworld/train.jsonl \
#   python -m unirl.train_agentic_env_async --config-name=alfworld/alfworld_grpo_async num_devices=8

num_devices: 8
batch_size: 8 # P complete GRPO groups (games) trained per rollout step
num_rollouts: 30
weight_sync_interval: 1
eval_interval: 0

# ---- async / disaggregation knobs (LIN-531) ----
train_fraction: 0.5 # 4 train GPUs (FSDP) + 4 rollout GPUs (resident agentic engine)
oversample_batch_size: 12 # generate 12 games/drive; train the freshest 8 without waiting for every slow game
buffer_max_staleness: 2 # bounded off-policy: a buffered group may cross up to 2 syncs
tail_policy: drop # ALFWorld reset creates a fresh episode; interrupted stateful tails cannot resume

worker_max_concurrency: 8
stop: null # ALFWorld actions are free text; rely on per-turn max_new_tokens

adv_normalization_scope: group
normalize_adv_by_std: true

logging:
  report_to_wandb: false
  project_name: unirl-alfworld
  run_name: alfworld_grpo_qwen3_async
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [alfworld, agentic, multi-turn, env-reward, grpo, qwen3, async, partial-rollout, drop, lin-531]

bundle:
  _target_: unirl.models.qwen3.bundle.Qwen3Bundle.from_config
  config:
    _target_: unirl.models.qwen3.config.Qwen3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN3_INSTRUCT_PATH,Qwen/Qwen3-4B-Instruct}
    model_precision: fp32
    use_gradient_checkpointing: true
    attn_implementation: flex_attention

pipeline:
  _target_: unirl.models.qwen3.pipeline.Qwen3Pipeline.from_bundle
  enable_thinking: false
  autocast_precision: bf16
  logprob_precision: fp32

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["Qwen3DecoderLayer"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
    forward_prefetch: false
    defer_grad_sync: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.01
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 1000

rollout:
  # Multi-turn agentic engine driving a STATEFUL per-episode ALFWorld env, DISAGGREGATED
  # (owns its own GPU slab, stays resident). partial_rollout=true → the in-flight tail is
  # checkpointed at a turn boundary on each weight sync and then dropped by the trainer.
  _target_: unirl.rollout.engine.agentic.engine.AgenticRolloutEngine
  config:
    _target_: unirl.rollout.engine.agentic.config.AgenticRolloutEngineConfig
    max_turns: 15 # ALFWorld is long-horizon; the variance the async overlap exploits
    per_worker_concurrency: 8
    partial_rollout: true
    inner:
      _target_: unirl.rollout.engine.sglang.config.SGLangEngineConfig
      backend: native
      pretrained_model_ckpt_path: ${oc.env:QWEN3_INSTRUCT_PATH,Qwen/Qwen3-4B-Instruct}
      tp_size: 1
      max_new_tokens: 256
      temperature: 1.0
      top_p: 1.0
      concurrency: 8
      chat_template_kwargs:
        enable_thinking: false
      engine_kwargs:
        # Disaggregated: the engine owns the rollout GPU (no colocated FSDP shard) → more KV.
        mem_fraction_static: 0.8
        skip_server_warmup: true
        attention_backend: triton
        disable_cuda_graph: false
        cuda_graph_max_bs: 16
        enable_lora: false
    env:
      _target_: unirl.rollout.loop.alfworld_env.AlfworldEnv
      split: train
      max_steps: 15 # keep == config.max_turns
      step_penalty: 0.0
      max_obs_chars: 1500
      config_file: ${oc.env:ALFWORLD_CONFIG,""}
    episode_sampling:
      _target_: unirl.types.sampling.ARSamplingParams
      samples_per_prompt: 8 # n — GRPO group (siblings share the same game)
      temperature: 1.0
      top_p: 1.0
      top_k: 0
      max_new_tokens: 256

reward:
  # BUILT BUT UNUSED — reward is env-sourced (AsyncAgenticEnvTrainer reads the env return).
  _target_: unirl.reward.service.RewardService
  truncated_reward: keep
  backend:
    _target_: unirl.reward.local.mathverify.MathVerifyRewardScorer
    base_device: cpu
    config:
      _target_: unirl.reward.local.mathverify.MathVerifySpec

algorithm:
  _target_: unirl.algorithms.grpo.GRPO
  stage_attr: ar
  clip_range: 0.2
  clip_range_high: null
  clip_schedule: constant
  loss_agg_mode: seq-mean-token-mean
  horizon: 256
  sampling_temperature: 1.0
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.qwen3.conditions.Qwen3ARConditions

sync:
  # Cross-slab full-weight sync (disaggregated) — NCCL, not the colocate TensorWeightSync.
  _target_: unirl.distributed.weight_sync.full.nccl.NCCLWeightSync
  group_name: weight_sync
  lora_merged: false
  bucket_size_mb: 512
  flush_cache: true

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  num_updates_per_batch: 1

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: ${oc.env:DATA_PATH} # game-index rows: {"prompt": "", "metadata": {"game_index": i, "game_file": ...}}
      eval_data_path: ${oc.env:EVAL_DATA_PATH,${oc.env:DATA_PATH}}
      seed: 42
    algorithm:
      prompts_per_rollout: 12 # == oversample_batch_size (the producer's per-drive game pool)

sampling:
  _target_: unirl.types.sampling.ARSamplingParams
  samples_per_prompt: 8 # MUST match episode_sampling
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  max_new_tokens: 256
