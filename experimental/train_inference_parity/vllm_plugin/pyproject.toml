[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unirl-train-inference-parity-vllm"
version = "0.1.0"
description = "Experimental UniRL train/inference parity plugin for vLLM"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }

[project.entry-points."vllm.general_plugins"]
unirl_train_inference_parity = "unirl_train_inference_parity_vllm:register"

[tool.setuptools.packages.find]
where = ["src"]
include = ["unirl_train_inference_parity_vllm*"]
